 $("rcount").textContent=`${l.length} ${l.length===1?"rețetă":"rețete"}${S.sort==="compat"?", ordonate după ce ai în frigider":""}`;
 $("rlist").innerHTML=l.map(r=>rcard(r,r.id===S.detail)).join("")||`<div class="empty" style="grid-column:1/-1"><img src="${IM("img/bowl_with_spoon.png")}" alt="">Nicio rețetă nu se potrivește. Încearcă alt filtru sau alte ingrediente.</div>`;
 renderDetail()}
function renderDetail(){const d=$("detail");if(!d)return;const r=rec(S.detail);if(!r){d.innerHTML="";return}
 d.innerHTML=`<div style="position:relative">${tile(r)}${heartBtn(r.id)}</div><div class="detail-b"><h2>${esc(r.n)}</h2>
  <p class="meta">${I("clock")}${r.t} min · ${I("level")}${esc(r.dif)} · ${r.por} porții</p>${compatLine(r)}
  <div><p class="h3" style="margin-bottom:4px">Ingrediente</p>${ingList(r)}</div>
  <button class="btn primary" onclick="openRecipe('${r.id}')">Vezi rețeta completă ${I("arrow")}</button></div>`}
function ingList(r){const A=avail(),sc=stockCheck(r);return `<ul class="ilist">${sc.map(x=>{const {n,q,u}=x,ok=x.st==="ok",sb=x.st==="none"&&subFor(n,A);
 const note=x.st==="part"?`<small class="lack">Ai ${fmtQ(x.have,u)} · lipsesc ${fmtQ(x.miss,u)}</small>`:x.st==="none"&&!sb?`<small class="lack">Lipsește${x.miss!=null?`: ${fmtQ(x.miss,u)}`:""}</small>`:x.unk?`<small>În frigider, în altă unitate: verifică tu cantitatea</small>`:sb?`<small>Poți folosi ${esc(sb)} din frigider</small>`:"";
 return `<li><span class="st ${ok?"ok":sb||x.st==="part"?"sub":"no"}">${I(ok||sb?"check":x.st==="part"?"minus":"x")}</span>${thumb(n)}<span class="n">${esc(n)}${note}</span><span class="q">${fmtQ(q,u)}</span></li>`}).join("")}</ul>`}
function pick(id){if(S.page==="retete"&&wide()){S.detail=id;save();document.querySelectorAll(".rcard").forEach(c=>c.removeAttribute("aria-current"));event?.currentTarget?.setAttribute?.("aria-current","true");renderDetail()}else openRecipe(id)}

/* ---------- Fereastra rețetei ---------- */
function openRecipe(id){const r=byId(id);if(!r||(r.status==="hid"&&!isStaff()))return;
 if(!SRV)return openRecipeCore(id);
 srvGate(id).then(g=>{if(g.err)return toast(g.err);openRecipeCore(id,g)})}
function openRecipeCore(id,g){const r=byId(id);if(!r||(r.status==="hid"&&!isStaff()))return;POP=null;drawPop();ensureMonth();
 const P=g?g.premium&&!g.locked:prem(),locked=g?g.locked:(!P&&!S.viewed.includes(id)&&S.viewed.length>=S.limit);
 if(!locked&&!P&&!S.viewed.includes(id)){S.viewed.push(id);save()}else if(g)save()
 const A=avail(),miss=lacks(r),me=ME();
 const nut=`<div class="nut ${P?"":"locked"}"><div class="cells"><div><b>${P?r.k:"000"}</b><span>kcal</span></div><div><b>${P?r.p:"00"} g</b><span>proteine</span></div><div><b>${P?r.c:"00"} g</b><span>carbohidrați</span></div><div><b>${P?r.f:"00"} g</b><span>grăsimi</span></div></div>
  ${P?"":`<div class="lockmsg"><button class="btn honey sm" onclick="closeModal();go('premium')">${I("lock")}Deblochează cu Premium</button></div>`}</div><p class="small muted" style="margin-top:6px">Valori nutriționale pe porție.</p>`;
 const days=[...Array(7)].map((_,k)=>addD(monday(),k));
 const guest=`<div class="box"><p class="small">Cu un cont gratuit poți salva rețeta la favorite, o poți adăuga în planificator, poți trimite lipsurile pe lista de cumpărături și poți scădea ingredientele din frigider.</p><div class="rowacts"><button class="btn sm primary" onclick="closeModal();authModal('register')">Creează cont</button><button class="btn sm" onclick="closeModal();authModal('login')">Autentificare</button></div></div>`;
 const body=locked?`<div class="paywall"><p class="eyebrow" style="color:var(--honey)">${I("crown")} Premium</p><h3>Ai deschis toate cele ${S.limit} rețete gratuite din această lună</h3><p>Cu Premium ai acces nelimitat la rețete, valori nutriționale și planificare automată.</p><button class="btn honey" onclick="closeModal();go('premium')">Vezi planurile</button></div>`
 :`<div class="cols2"><div style="display:flex;flex-direction:column;gap:12px"><p class="h3">Ingrediente</p>${ingList(r)}
   ${!me?"":miss.length?`<div class="missbox"><p class="small"><b>Îți lipsesc:</b> ${miss.map(x=>esc(x.miss!=null?`${num(x.miss)} ${x.u||""}`.trim()+" "+x.n:x.n)).join(", ")}</p><button class="btn sm primary" id="missBtn" onclick="addMissing('${id}')">${I("cart")}Adaugă ingredientele lipsă în lista de cumpărături</button></div>`:`<p class="compat">${I("checkc")}Ai toate ingredientele</p>`}
   ${me?`<div class="box"><p class="h3" style="font-size:14px">Adaugă în planificator</p><div class="form"><select id="pday" class="field" aria-label="Zi">${days.map(d=>`<option value="${iso(d)}" ${iso(d)===todayS()?"selected":""}>${dayName(d)} ${d.getDate()}</option>`).join("")}</select>
   <select id="pmeal" class="field" aria-label="Masă">${[...MEALS,...EXTRA_MEALS].map(m=>`<option ${(r.cat||[]).includes(m)?"selected":""}>${m}</option>`).join("")}</select><button class="btn sm" onclick="planPut($('pday').value,$('pmeal').value,'${id}')&&toast('Adăugată în planificator')">${I("cal")}Adaugă</button></div></div>`:guest}</div>
  <div style="display:flex;flex-direction:column;gap:12px"><p class="h3">Preparare</p><ol class="steps">${r.s.map(x=>`<li><span>${esc(x)}</span></li>`).join("")}</ol>
   ${me?`<div id="cookbox"><button class="btn primary" onclick="cookAsk('${id}')">${I("cook")}Am gătit-o</button><p class="small muted" style="margin-top:6px">Scădem ingredientele folosite din frigider, după confirmare.</p></div>`:""}</div></div>`;
 openModal(`<div class="sheet-top"><div class="media">${tile(r)}${heartBtn(id)}</div>
  <div style="display:flex;flex-direction:column;gap:10px;padding-right:36px"><p class="eyebrow">${(r.cat||[]).join(" · ")}${r.veg?" · Vegetarian":""}${r.status==="hid"?" · Ascunsă":""}</p><h2>${esc(r.n)}</h2><p class="muted">${esc(r.d||"")}</p>
  <div class="facts"><span class="fact">${I("clock")}${r.t} min</span><span class="fact">${I("level")}${esc(r.dif)}</span><span class="fact">${I("users")}${r.por} porții</span><span class="fact" style="color:var(--green)">${I("checkc")}${r.i.length-miss.length} din ${r.i.length} în stoc</span></div>
  ${can("recipes")?`<div><button class="btn sm" onclick="closeModal();recEdit('${id}')">${I("edit")}Editează rețeta</button></div>`:""}</div></div>
  <div class="sheet-b">${nut}${body}</div>`)}
/* trimite pe listă DOAR ce lipsește (cantitatea lipsă), fără dubluri; lista grupează singură pe categorii */
function addMissing(id){if(!ME()){authModal("register");return 0}const r=byId(id);if(!r)return 0;let k=0;const cats={};
 lacks(r).forEach(x=>{const q=x.miss!=null?x.miss:"",u=x.miss!=null?(x.u||""):"";
  const ex=S.shop.find(s=>s.n===x.n&&!s.d);
  if(ex){if(q!==""&&(ex.u||"")===u&&(+ex.q||0)<q){ex.q=q;k++;cats[prod(x.n).cat]=(cats[prod(x.n).cat]||0)+1}return}
  S.shop.push({n:x.n,q,u,d:false});k++;const c=prod(x.n).cat||"Altele";cats[c]=(cats[c]||0)+1});
 save();
 const sum=CATS.filter(c=>cats[c]).map(c=>`${c} ${cats[c]}`).join(", ");
 const b=$("missBtn");if(b){b.innerHTML=I("check")+(k?`Am adăugat ${k} pe listă`:"Sunt deja pe listă");b.disabled=true}
 if(k)toast(`Pe listă: ${sum}`);return k}
function cookPlan(r){return r.i.map(([n,q,u])=>{const f=S.fridge.find(x=>x.n===n);if(!f)return null;
 let rq=+q;if(f.u==="kg"&&u==="g")rq=q/1000;else if(f.u==="l"&&u==="ml")rq=q/1000;else if(f.u!==u)return{n,manual:true};return{n,rq,u:f.u}}).filter(Boolean)}
function cookAsk(id){const pl=cookPlan(byId(id));COOK=id;
 $("cookbox").innerHTML=`<div class="box honey"><p class="h3" style="font-size:14px">Scădem din frigider:</p><ul style="margin:0;padding-left:18px;font-size:14px">${pl.map(x=>x.manual?`<li>${esc(x.n)}: verifici tu cantitatea</li>`:`<li>${esc(x.n)}: −${num(x.rq)} ${esc(x.u)}</li>`).join("")||"<li>Niciun ingredient din frigider</li>"}</ul>
  <div style="display:flex;gap:8px"><button class="btn primary sm" onclick="cookDo('${id}')">Confirmă</button><button class="btn sm" onclick="openRecipe('${id}')">Anulează</button></div></div>`}
function cookDo(id){const pl=cookPlan(byId(id));let k=0;
 pl.forEach(x=>{if(x.manual)return;const f=S.fridge.find(y=>y.n===x.n);if(!f)return;
  logEv("u",f.n,Math.min(+f.q,x.rq),f.u);f.q=Math.round((+f.q-x.rq)*100)/100;k++;if(f.q<=0)S.fridge.splice(S.fridge.indexOf(f),1)});
 S.demo=false;save();$("cookbox").innerHTML=`<p class="compat">${I("checkc")}Poftă bună! Am actualizat ${k} produse în frigider.</p>`}

/* ---------- Frigider ---------- */
let FQ="";
function logEv(k,n,q,u){const v=Math.round(value({n,q,u}));S.log.push({i:uid8()+uid8(),d:todayS(),k,n,c:prod(n).cat,v});if(S.log.length>2000)S.log.splice(0,S.log.length-2000)}
PAGES.frigider=function(){
 const total=S.fridge.length,ex=expiring(),val=S.fridge.reduce((s,f)=>s+value(f),0),fq=FQ.trim().toLowerCase();
 const expired=S.fridge.filter(f=>f.x&&daysLeft(f.x)<0);
 const list=S.fridge.map((f,i)=>({...f,i,cat:prod(f.n).cat})).filter(f=>(S.fcat==="Toate"||f.cat===S.fcat)&&(!fq||f.n.includes(fq)));
 const sel=S.fridge.filter(f=>f.s).length;
 const exN=new Set(ex.map(f=>f.n)),useIt=recipes().filter(r=>r.i.some(x=>exN.has(x[0]))).slice(0,3);
 return pagehead("Frigiderul meu",esc(txt("frSub")),`<button class="btn primary" onclick="S.addOpen=!S.addOpen;save();draw();setTimeout(()=>$('fn')&&$('fn').focus())">${I("plus")}Adaugă ingredient</button>`)+famBanner()+
 `${S.addOpen?`<form class="card addpanel" onsubmit="addFridge(event)"><p class="h3">Ingredient nou</p><div class="form">
  <label class="lbl grow">Produs<input id="fn" class="field" list="dlp3" required placeholder="ex. roșii" oninput="const p=S.products[this.value.trim().toLowerCase()];if(p){const u=$('fu');const m={kg:'g',l:'ml'}[p.u]||p.u;if([...u.options].some(o=>o.value===m))u.value=m}"><datalist id="dlp3">${allProducts().map(x=>`<option value="${esc(x)}">`).join("")}</datalist></label>
  <label class="lbl">Cantitate<input id="fq" class="field w90" type="number" min="0" step="any" value="1"></label>
  <label class="lbl">Unitate<select id="fu" class="field">${UNITS.map(u=>`<option>${u}</option>`).join("")}</select></label>
  <label class="lbl">Expiră la<input id="fx" class="field" type="date" value="${inDays(7)}"></label>
  <button class="btn primary">Adaugă</button><button type="button" class="btn ghost" onclick="S.addOpen=false;save();draw()">Închide</button></div></form>`:""}
 ${S.demo?`<div class="freebar tone-g">Produsele afișate sunt exemple, ca să vezi cum funcționează frigiderul.<button class="link" onclick="S.fridge=[];S.demo=false;save();draw()">Golește frigiderul</button></div>`:""}
 ${expired.length?`<div class="freebar tone-r">${I("alarm")}${expired.length} ${expired.length===1?"produs a expirat":"produse au expirat"}: ${esc(expired.slice(0,3).map(f=>f.n).join(", "))}${expired.length>3?"…":""}<button class="link" onclick="tossExpired()">Aruncă-le și înregistrează risipa</button></div>`:""}
 <div class="stats"><div class="card stat"><span class="ic g">${I("leaf")}</span><span><small>Total ingrediente</small><b>${total}</b></span></div>
  <div class="card stat"><span class="ic r">${I("alarm")}</span><span><small>Expiră în 3 zile</small><b>${ex.length}</b></span></div>
  <div class="card stat"><span class="ic h">${I("coin")}</span><span><small>Valoare estimată</small><b>${Math.round(val).toLocaleString("ro-RO")} MDL</b></span></div></div>
 ${useIt.length?`<div class="suggest">${I("alarm")}<span><b>${ex.length} ${ex.length===1?"produs expiră":"produse expiră"} curând.</b> Le poți folosi în:</span><div class="chips">${useIt.map(r=>`<button class="chip" onclick="openRecipe('${r.id}')">${esc(r.n)}</button>`).join("")}</div></div>`:""}
 <div class="toolbar"><label class="search" style="max-width:260px">${I("search")}<input id="fsearch" type="search" placeholder="Caută ingredient…" value="${esc(FQ)}" oninput="FQ=this.value;draw();const e=$('fsearch');e.focus();e.setSelectionRange(e.value.length,e.value.length)" aria-label="Caută în frigider"></label>
  <div class="chips">${["Toate",...CATS].map(c=>`<button class="chip" aria-pressed="${S.fcat===c}" onclick="S.fcat='${c}';save();draw()">${c}</button>`).join("")}</div></div>
 ${list.length?`<div class="fcols">${CATS.map(c=>{const it=list.filter(f=>f.cat===c).sort((a,b)=>(a.x||"9").localeCompare(b.x||"9"));if(!it.length)return"";
  return `<div class="card fcol"><div class="fcol-h">${CATT[c]}<span class="badge">${it.length}</span></div>${it.map(f=>{const st=["g","ml"].includes(f.u)?50:1;return `<div class="frow">
   <input type="checkbox" class="chk" ${f.s?"checked":""} onchange="S.fridge[${f.i}].s=this.checked;save();draw()" aria-label="Gătește cu ${esc(f.n)}">${thumb(f.n)}
   <span class="n"><b>${esc(f.n)}</b><span>${fmtQ(f.q,f.u)}${f.x?" · ":""}${expLabel(f.x)}</span></span>
   <span class="qty"><button onclick="qty(${f.i},-${st})" aria-label="Mai puțin">${I("minus")}</button><button onclick="qty(${f.i},${st})" aria-label="Mai mult">${I("plus")}</button></span>
   <button class="del" onclick="fridgeDrop(${f.i})" aria-label="Scoate ${esc(f.n)} din frigider">${I("trash")}</button></div>`}).join("")}</div>`}).join("")}</div>`
 :`<div class="empty"><img src="${IM("img/leafy_green.png")}" alt="">${S.fridge.length?"Niciun produs nu se potrivește filtrului.":"Frigiderul e gol. Apasă „Adaugă ingredient” ca să începi."}</div>`}
 ${sel?`<div class="actionbar"><span>${sel} ${sel===1?"produs selectat":"produse selectate"}</span><button class="btn honey" onclick="cookFrom()">Vezi ce poți găti ${I("arrow")}</button></div>`:`<p class="small muted">Bifează produsele pe care vrei să le folosești și îți arătăm rețetele potrivite.</p>`}`};
function qty(i,d){const f=S.fridge[i];if(!f)return;const nq=Math.max(0,Math.round((+f.q+d)*100)/100);
 if(d<0){logEv("u",f.n,+f.q-nq,f.u)}
 f.q=nq;if(f.q<=0)S.fridge.splice(i,1);S.demo=false;save();draw()}
function addFridge(e){e.preventDefault();const n=$("fn").value.trim().toLowerCase();if(!n)return;
 const ex=S.fridge.find(f=>f.n===n&&f.u===$("fu").value);
 if(ex){ex.q=+ex.q+(+$("fq").value||0);if($("fx").value)ex.x=$("fx").value}else S.fridge.push({n,q:+$("fq").value||1,u:$("fu").value,x:$("fx").value,s:false});
 S.demo=false;save();draw();toast(`Am adăugat ${n} în frigider`);setTimeout(()=>$("fn")&&$("fn").focus())}
function cookFrom(){S.sel=[...new Set(S.fridge.filter(f=>f.s).map(f=>f.n))];S.rcat="Toate";S.sort="compat";go("retete")}
function fridgeDrop(i){const f=S.fridge[i];if(!f)return;
 openModal(`<div class="sheet-b"><div style="padding-right:36px"><p class="eyebrow">Scoți din frigider</p><h2 style="font-size:22px">${esc(f.n)} · ${fmtQ(f.q,f.u)}</h2></div>
 <p class="muted small">Spune-ne ce s-a întâmplat cu el, ca statisticile despre risipă să fie corecte.</p>
 <div class="choices"><button class="choice" onclick="dropDo(${i},'u')"><b>${I("checkc")}L-am consumat</b><span>Îl număr la ce ai folosit</span></button>
 <button class="choice" onclick="dropDo(${i},'w')"><b>${I("trash")}L-am aruncat</b><span>Expirat sau stricat; îl număr la risipă</span></button>
 <button class="choice" onclick="dropDo(${i},'x')"><b>${I("x")}Doar îl elimin</b><span>L-am adăugat din greșeală; nu apare în statistici</span></button></div></div>`,1)}
function dropDo(i,k){const f=S.fridge[i];if(!f){closeModal();return}
 if(k!=="x")logEv(k,f.n,f.q,f.u);S.fridge.splice(i,1);S.demo=false;save();closeModal();
 toast(k==="w"?`${f.n}: înregistrat ca risipă`:k==="u"?`${f.n}: înregistrat ca folosit`:`${f.n} a fost eliminat`)}
function tossExpired(){const ex=S.fridge.filter(f=>f.x&&daysLeft(f.x)<0);ex.forEach(f=>logEv("w",f.n,f.q,f.u));
 S.fridge=S.fridge.filter(f=>!(f.x&&daysLeft(f.x)<0));S.demo=false;save();draw();toast(`${ex.length} produse înregistrate ca risipă`)}

/* ---------- Cumpărături ---------- */
PAGES.lista=function(){
 const todo=S.shop.filter(s=>!s.d),done=S.shop.filter(s=>s.d),est=todo.reduce((a,s)=>a+value(s),0);
 const inF=S.shop.filter(s=>!s.d&&inFridge(s.n)).length;
 const row=s=>{const i=S.shop.indexOf(s);return `<div class="srow ${s.d?"done":""}"><input type="checkbox" id="sh${i}" ${s.d?"checked":""} onchange="S.shop[${i}].d=this.checked;save();draw()">${thumb(s.n)}
  <label for="sh${i}"><b>${esc(s.n)}</b><span>${fmtQ(s.q,s.u)}${!s.d&&inFridge(s.n)?" · ai deja în frigider":""}</span></label>
  <button class="iconbtn" onclick="S.shop.splice(${i},1);save();draw()" aria-label="Șterge ${esc(s.n)}">${I("x")}</button></div>`};
 return pagehead("Lista de cumpărături",`${esc(txt("shopSub"))} · ${todo.length} de cumpărat, aproximativ ${Math.round(est)} MDL`,
  `<button class="btn" onclick="shareList()">${I("share")}Partajează</button><button class="btn" onclick="importPick()">${I("grid")}Importă din rețetă</button>`)+
 `<form class="card addpanel" onsubmit="addShop(event)"><div class="form"><label class="lbl grow">Produs<input id="sn" class="field" list="dlp4" required placeholder="ex. lapte"><datalist id="dlp4">${allProducts().map(x=>`<option value="${esc(x)}">`).join("")}</datalist></label>
  <label class="lbl">Cantitate<input id="sq" class="field w90" type="number" min="0" step="any" placeholder="1"></label>
  <label class="lbl">Unitate<select id="su" class="field">${UNITS.map(u=>`<option>${u}</option>`).join("")}</select></label><button class="btn primary">${I("plus")}Adaugă</button></div></form>
 ${inF?`<div class="suggest">${I("fridge")}<span><b>${inF} ${inF===1?"produs e":"produse sunt"} deja în frigider.</b></span><button class="btn sm" onclick="S.shop=S.shop.filter(s=>s.d||!inFridge(s.n));save();draw();toast('Am eliminat produsele pe care le ai')">Elimină-le din listă</button></div>`:""}
 ${S.shop.length?`<div class="scols">${CATS.map(c=>{const it=todo.filter(s=>prod(s.n).cat===c);return it.length?`<div class="card slist"><div class="fcol-h" style="padding-top:12px">${CATT[c]}<span class="badge">${it.length}</span></div>${it.map(row).join("")}</div>`:""}).join("")}
  ${done.length?`<div class="card slist"><div class="fcol-h" style="padding-top:12px">În coș<span class="badge">${done.length}</span></div>${done.map(row).join("")}
   <div style="display:flex;gap:8px;flex-wrap:wrap;padding:12px 0"><button class="btn primary sm" onclick="toFridge()">${I("fridge")}Mută în frigider</button><button class="btn sm" onclick="S.shop=S.shop.filter(s=>!s.d);save();draw()">Șterge din listă</button></div></div>`:""}</div>`
 :`<div class="empty"><img src="${IM("img/red_apple.png")}" alt="">Lista e goală. Adaugă produse sau importă ingredientele lipsă dintr-o rețetă.</div>`}
 ${prem()?"":`<div class="card hint"><span class="ic g">${I("users")}</span><span style="flex:1;min-width:200px"><b>Liste partajate cu familia</b><br><span class="small muted">În versiunea cu server, Premium va sincroniza lista pentru toți membrii familiei.</span></span><button class="btn sm" onclick="go('premium')">${I("crown")}Află mai mult</button></div>`}`};
function addShop(e){e.preventDefault();const n=$("sn").value.trim().toLowerCase();if(!n)return;S.shop.push({n,q:$("sq").value?+$("sq").value:"",u:$("sq").value?$("su").value:"",d:false});save();draw();setTimeout(()=>$("sn")&&$("sn").focus())}
function toFridge(){const d=S.shop.filter(s=>s.d);d.forEach(s=>{const f=S.fridge.find(x=>x.n===s.n&&x.u===s.u);if(f&&s.q)f.q=+f.q+(+s.q);else if(!f)S.fridge.push({n:s.n,q:s.q||1,u:s.u||"buc",x:inDays(7),s:false})});
 S.shop=S.shop.filter(s=>!s.d);S.demo=false;save();draw();toast(`${d.length} produse mutate în frigider`)}

 const done=()=>toast("Lista a fost copiată. O poți lipi într-un mesaj.");

PAGES.plan=function(){const m=monday(),days=[...Array(7)].map((_,k)=>addD(m,k)),td=todayS();
 const allSlots=days.flatMap(d=>daySlots(iso(d)).map(x=>iso(d)+"|"+x)),planned=allSlots.map(k=>S.plan[k]).filter(id=>rec(id));
 const f=d=>`${d.getDate()}.${pad2(d.getMonth()+1)}`;
 return pagehead("Planificator de mese",`${esc(txt("planSub"))} Săptămâna ${f(days[0])} – ${f(days[6])} · ${planned.length} din ${allSlots.length} mese planificate`,
  `<button class="btn" onclick="planShop()">${I("cart")}Lipsurile pe listă</button><button class="btn ${prem()?"primary":""}" onclick="autoPlan()">${prem()?I("spark"):I("lock")}Planificare automată</button>`)+
 `${prem()?"":`<div class="freebar">${I("crown")}Planificarea automată pentru toată săptămâna, după ce ai în frigider, e inclusă în Premium. Manual poți planifica oricând.<button class="link" onclick="go('premium')">Vezi Premium ${I("arrow")}</button></div>`}
 <div class="week">${days.map(d=>{const k=iso(d);return `<div class="card day ${k===td?"today":""}"><div class="day-h"><b>${dayName(d)}</b><span>${f(d)}</span></div>
  ${daySlots(k).map(x=>{const r=rec(S.plan[k+"|"+x]);const s=r&&rsrc(r);return `<div class="slotw ${isExtra(x)?"extra":""}"><button class="slot" onclick="slotPick('${k}','${x}')"><small>${x}</small>${r?`<span class="pick">${s?`<img src="${s.u}" class="${s.photo?"":"ill"}" alt="">`:""}<span>${esc(r.n)}</span></span>`:`<span class="slot-add">${I("plus")}Adaugă</span>`}</button>${isExtra(x)?`<button class="slotx" onclick="delDaySlot('${k}','${x}');draw()" aria-label="Șterge ${x} din ${dayName(d)}">${I("x")}</button>`:""}</div>`}).join("")}
  <div class="addmeal"><button class="link" onclick="addDaySlot('${k}','Gustare')&&draw()">${I("plus")}Gustare</button><button class="link" onclick="addDaySlot('${k}','Chindie')&&draw()">${I("plus")}Chindie</button></div></div>`}).join("")}</div>
 <p class="small muted">Atinge o masă ca s-o schimbi sau s-o elimini. Gustările și chindiile se adaugă sau se șterg pentru fiecare zi.</p>`};
const fitsMeal=(r,meal)=>isExtra(meal)?((r.cat||[]).includes("Desert")||r.t<=15):(r.cat||[]).includes(meal);
function slotPick(k,meal){const A=avail(),cur=S.plan[k+"|"+meal];
 const l=recipes().slice().sort((a,b)=>(fitsMeal(b,meal)-fitsMeal(a,meal))||compat(b,A)/b.i.length-compat(a,A)/a.i.length);
 openModal(`<div class="sheet-b"><div style="padding-right:36px"><p class="eyebrow">${dayName(new Date(k+"T00:00"))} · ${meal}</p><h2 style="font-size:22px">Alege o rețetă</h2></div>
 <ul class="plist">${l.map(r=>`<li><button onclick="S.plan['${k}|${meal}']='${r.id}';save();closeModal()"><span class="thumb">${tile(r)}</span><span style="flex:1"><b>${esc(r.n)}</b><br><span class="small muted">${r.t} min · ${compat(r,A)} din ${r.i.length} disponibile</span></span>${r.id===cur?I("checkc"):""}</button></li>`).join("")}</ul>
 ${cur?`<button class="btn" onclick="delete S.plan['${k}|${meal}'];save();closeModal()">${I("trash")}Elimină din plan</button>`:""}</div>`,1)}
function autoPlan(){if(!prem()){go("premium");toast("Planificarea automată e inclusă în Premium");return}
 const A=avail(),used=new Set(Object.values(S.plan));let n=0;
 [...Array(7)].map((_,k)=>iso(addD(monday(),k))).forEach(k=>daySlots(k).forEach(m=>{if(rec(S.plan[k+"|"+m]))return;
  const c=recipes().filter(r=>fitsMeal(r,m)).sort((a,b)=>(used.has(a.id)-used.has(b.id))||compat(b,A)/b.i.length-compat(a,A)/a.i.length);
  if(c[0]){S.plan[k+"|"+m]=c[0].id;used.add(c[0].id);n++}}));
 save();draw();toast(n?`Am completat ${n} mese, după ce ai în frigider`:"Săptămâna e deja planificată")}
function planShop(){const A=avail(),need={};Object.entries(S.plan).forEach(([k,id])=>{const d=new Date(k.split("|")[0]+"T00:00");if(d<monday()||d>addD(monday(),6))return;const r=rec(id);r&&r.i.forEach(([n,q,u])=>{if(!A.has(n)){need[n]=need[n]||{q:0,u};if(need[n].u===u&&typeof q==="number")need[n].q+=q}})});
 let k=0;Object.entries(need).forEach(([n,v])=>{if(!S.shop.some(s=>s.n===n&&!s.d)){S.shop.push({n,q:v.q||"",u:v.q?v.u:"",d:false});k++}});save();draw();toast(k?`Am adăugat ${k} produse pe listă`:"Ai deja tot ce trebuie")}

const TIPS={"Legume":"Cumpără cantități mici, de două ori pe săptămână, și gătește mai întâi ce expiră repede.","Fructe":"Fructele foarte coapte merg în smoothie-uri sau în clătite; congelează-le înainte să se strice.","Lactate":"Verifică data înainte de cumpărare și pune în planificator rețetele cu lactate.","Carne":"Congelează porțiile pe care nu le gătești în 2 zile.","Cereale":"Pâinea veche se transformă în crutoane; paste și orez se păstrează mult mai bine.","Condimente":"Cumpără ambalaje mici și verifică lista înainte de a reface stocul.","Băuturi":"Deschide un singur ambalaj o dată și notează data deschiderii.","Altele":"Verifică dulapul înainte de cumpărături, ca să nu iei de două ori același lucru."};
const anWeeks=()=>prem()&&[4,8,12].includes(+S.anSub)?+S.anSub:4;
function anData(){const n=anWeeks(),m0=monday();
 const B=[...Array(n)].map((_,i)=>{const s=addD(m0,-(n-1-i)*7);return{s:iso(s),e:iso(addD(s,6)),u:0,w:0,un:0,wn:0}});
 const from=B[0].s,pFrom=addDaysS(from,-7*n),pTo=addDaysS(from,-1);
 const cur={u:0,w:0,un:0,wn:0},prev={u:0,w:0,un:0,wn:0},cat={},prodW={};
 S.log.forEach(e=>{
  if(e.d>=from){const b=B.find(b=>e.d>=b.s&&e.d<=b.e);if(!b)return;
   if(e.k==="u"){b.u+=e.v;b.un++;cur.u+=e.v;cur.un++}
   else{b.w+=e.v;b.wn++;cur.w+=e.v;cur.wn++;const c=cat[e.c]||(cat[e.c]={v:0,n:0});c.v+=e.v;c.n++;const p=prodW[e.n]||(prodW[e.n]={v:0,n:0});p.v+=e.v;p.n++}}
  else if(e.d>=pFrom&&e.d<=pTo){if(e.k==="u"){prev.u+=e.v;prev.un++}else{prev.w+=e.v;prev.wn++}}});
 return{n,B,cur,prev,cat,prodW}}
function deltaHTML(cur,prev,goodDown){if(!prev)return `<span class="muted">fără perioadă anterioară</span>`;const p=Math.round((cur-prev)/prev*100);
 if(p===0)return `<span class="muted">la fel ca înainte</span>`;const good=goodDown?p<0:p>0;
 return `<span class="delta ${good?"good":"bad"}">${I(p<0?"down":"up")}${Math.abs(p)}% ${p<0?"mai puțin":"mai mult"} decât înainte</span>`}
const kpi=(l,v,s)=>`<div class="card kpi"><small>${l}</small><b>${v}</b><span class="kd">${s||""}</span></div>`;
function clearDemoLog(){S.log=S.log.filter(e=>!e.demo);save();draw();toast("Datele demonstrative au fost șterse")}
PAGES.stats=function(){const P=prem(),D=anData(),c=D.cur,tot=c.u+c.w,rate=tot?Math.round(c.u/tot*100):null;
 const demoN=S.log.some(e=>e.demo),n=D.n;
 const filt=[4,8,12].map(w=>w===4||P?`<button class="chip" aria-pressed="${n===w}" onclick="S.anSub='${w}';save();draw()">${w} săptămâni</button>`:`<button class="chip locked" onclick="go('premium')">${I("lock")}${w} săptămâni</button>`).join("");
 const cats=Object.entries(D.cat).sort((a,b)=>b[1].v-a[1].v),cmax=Math.max(1,...cats.map(x=>x[1].v));
 const tops=Object.entries(D.prodW).sort((a,b)=>b[1].v-a[1].v||b[1].n-a[1].n).slice(0,5);
 const tip=cats[0]?`<div class="card panel"><h3>Ce poți face</h3><p>Cea mai mare risipă vine din categoria <b>${esc(cats[0][0])}</b>: ${num(cats[0][1].v)} MDL, în ${cats[0][1].n} ${cats[0][1].n===1?"produs":"produse"}.</p><p class="muted">${esc(TIPS[cats[0][0]]||"")}</p>${c.w>D.prev.w&&D.prev.w>0?`<p class="small">Risipa a crescut față de perioada anterioară. Pune în planificator rețetele cu ingredientele care expiră primele.</p>`:`<p class="small">Continuă așa: fiecare produs folosit la timp înseamnă bani economisiți.</p>`}</div>`:"";
 const charts=!tot?"":`<section class="card panel viz" id="vz1">
   <div class="vizhead"><div><h3>Folosit și aruncat, pe săptămâni</h3><p class="small muted">Valoarea estimată a produselor scoase din frigider, în MDL</p></div>
    <div class="legend" role="list"><span role="listitem"><i class="sw-u"></i>Folosit</span><span role="listitem"><i class="sw-w"></i>Risipit</span></div></div>
   <div class="chartbox" id="wk" role="img" aria-label="Grafic cu coloane: valoarea folosită și aruncată pe fiecare săptămână. Datele sunt și în tabelul de mai jos."></div>
   <details class="tview"><summary>Vezi ca tabel</summary>${weekTable(D)}</details></section>
  <div class="anrow2">
   <section class="card panel viz"><h3>Risipă pe categorii</h3>${cats.length?`<div class="hbars">${cats.map(([k,v])=>`<div class="hb" tabindex="0" onpointermove="hbTip(event,${jsq(k)},${v.v},${v.n})" onfocus="hbTip(event,${jsq(k)},${v.v},${v.n})" onpointerleave="tipHide()" onblur="tipHide()"><span class="hl">${esc(k)}</span><span class="ht"><i style="width:${Math.max(2,v.v/cmax*100)}%"></i></span><span class="hv">${num(v.v)} MDL</span></div>`).join("")}</div>`:`<p class="muted">Nu ai aruncat nimic în această perioadă.</p>`}</section>
   <section class="card panel"><h3>Produse aruncate cel mai des</h3>${tops.length?`<table class="mini-t"><thead><tr><th>Produs</th><th>Ori</th><th>Valoare</th></tr></thead><tbody>${tops.map(([k,v])=>`<tr><td><span class="tcell">${thumb(k,"s28")}${esc(k)}</span></td><td>${v.n}</td><td>${num(v.v)} MDL</td></tr>`).join("")}</tbody></table>`:`<p class="muted">Nimic aruncat în această perioadă.</p>`}</section></div>${tip}`;
 const lockedBlock=!tot?"":`<section class="card panel viz lockedviz"><div class="fakeviz" aria-hidden="true"><div class="chartbox" id="wkfake"></div></div>
   <div class="lockover"><span class="ic h">${I("lock")}</span><h3>Rapoarte și tendințe, în Premium</h3><p class="muted">Grafic pe săptămâni, risipa pe categorii și produsele aruncate cel mai des, pe 4, 8 sau 12 săptămâni.</p><button class="btn honey" onclick="go('premium')">${I("crown")}Vezi Premium</button></div></section>`;
 return pagehead("Anti-risipă",esc(txt("statsSub")))+
 `${demoN?`<div class="freebar tone-g">Datele de mai jos sunt un exemplu, ca să vezi cum arată raportul. Ce faci tu de acum se adaugă la ele.<button class="link" onclick="clearDemoLog()">Șterge datele demonstrative</button></div>`:""}
 <div class="filters" role="group" aria-label="Perioadă">${filt}</div>
 ${!tot?`<div class="empty"><img src="${IM("img/seedling.png")}" alt="">Nu avem încă date pentru această perioadă. Când scoți produse din frigider sau marchezi o rețetă ca gătită, le înregistrăm aici.</div>`
 :`<div class="anrow"><section class="card herostat"><p class="eyebrow">Rata de utilizare</p><div class="bigfig">${rate}%</div><p class="muted">din valoarea produselor scoase din frigider în ultimele ${n} săptămâni a fost folosită, nu aruncată.</p>
   <div class="meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${rate}" aria-label="Rata de utilizare"><i style="width:${rate}%"></i></div></section>
  ${kpi("Valoare folosită",`${num(c.u)} MDL`,`${c.un} ${c.un===1?"produs":"produse"}`)}${kpi("Valoare aruncată",`${num(c.w)} MDL`,deltaHTML(c.w,D.prev.w,true))}${kpi("Produse aruncate",c.wn,deltaHTML(c.wn,D.prev.wn,true))}</div>`}
 ${P?charts:lockedBlock}`};
function weekTable(D){const f=s=>{const d=new Date(s+"T00:00");return `${d.getDate()}.${pad2(d.getMonth()+1)}`};
 return `<div class="tablewrap"><table class="cmp"><thead><tr><th>Săptămâna</th><th>Folosit (MDL)</th><th>Risipit (MDL)</th><th>Risipă</th></tr></thead><tbody>${D.B.map(b=>{const t=b.u+b.w;return `<tr><td>${f(b.s)} – ${f(b.e)}</td><td>${num(b.u)}</td><td>${num(b.w)}</td><td>${t?Math.round(b.w/t*100)+"%":"–"}</td></tr>`}).join("")}</tbody></table></div>`}

/* Grafic cu coloane suprapuse, desenat la lățimea reală a containerului */
const compactN=v=>v>=1000?(v/1000).toLocaleString("ro-RO",{maximumFractionDigits:1})+" K":String(Math.round(v));
function niceMax(max){if(max<=8)return 8;const p=Math.pow(10,Math.floor(Math.log10(max)));for(const k of [1,1.2,1.6,2,2.4,3,4,6,8,10])if(k*p>=max)return k*p;return 10*p}
function segPath(x,y,w,h,r,top){r=Math.min(r,h/2,w/2);return top?`M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`:`M${x},${y}H${x+w}V${y+h}H${x}Z`}
function wkSVG(B,w,h,live){const m={l:46,r:10,t:16,b:30},pw=w-m.l-m.r,ph=h-m.t-m.b,n=B.length;
 const max=Math.max(1,...B.map(b=>b.u+b.w)),top=niceMax(max),y=v=>m.t+ph-(v/top)*ph,band=pw/n,bw=Math.min(24,Math.max(8,band*.55)),base=m.t+ph;
 let g="";
 for(let i=0;i<=4;i++){const v=top/4*i,yy=y(v);g+=`<line x1="${m.l}" x2="${w-m.r}" y1="${yy}" y2="${yy}" class="${i?"gl":"ax"}"/><text x="${m.l-8}" y="${yy+4}" text-anchor="end" class="yt">${compactN(v)}</text>`}
 const skip=Math.max(1,Math.ceil(40/band)),fd=s=>{const d=new Date(s+"T00:00");return `${d.getDate()}.${pad2(d.getMonth()+1)}`};
 B.forEach((b,i)=>{const cx=m.l+band*(i+.5),x=cx-bw/2,hu=b.u/top*ph,hw=b.w/top*ph,both=hu>0&&hw>0;
  let s="";
  if(hu>0){const hh=Math.max(2,hu-(both?1:0));s+=`<path d="${segPath(x,base-hh,bw,hh,4,!both)}" class="su"/>`}
  if(hw>0){const hh=Math.max(2,hw-(both?1:0)),yy=base-hu-hh-(both?1:0);s+=`<path d="${segPath(x,yy,bw,hh,4,true)}" class="sx"/>`}
  const last=i===n-1&&b.w>0?`<text x="${cx}" y="${base-hu-hw-6}" text-anchor="middle" class="dl">${num(b.w)} MDL</text>`:"";
  g+=`<g class="col" data-i="${i}">${s}${last}${i%skip===(n-1)%skip?`<text x="${cx}" y="${h-10}" text-anchor="middle" class="xt">${i===n-1?"acum":fd(b.s)}</text>`:""}`+
   (live?`<rect class="hit" x="${m.l+band*i}" y="${m.t}" width="${band}" height="${ph+m.b-6}" tabindex="0" aria-label="${fd(b.s)}: folosit ${b.u} MDL, risipit ${b.w} MDL" onpointermove="wkTip(event,${i})" onfocus="wkTip(event,${i})" onpointerleave="tipHide()" onblur="tipHide()"/>`:"")+`</g>`});
 return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" class="wksvg" aria-hidden="${live?"false":"true"}">${g}</svg>`}
const FAKE_B=(()=>{const u=[210,180,260,230,300,270,320,350,300,380,340,400],w=[90,120,70,100,60,80,50,70,40,60,30,45];return u.map((v,i)=>({s:"2026-01-05",e:"2026-01-11",u:v,w:w[i]}))})();
function statsPaint(){const box=$("wk"),fk=$("wkfake");
 if(box){const D=anData(),w=Math.max(260,Math.floor(box.clientWidth||320));box._D=D;box.innerHTML=wkSVG(D.B,w,Math.min(280,Math.max(210,Math.round(w*.42))),true)}
 if(fk){const w=Math.max(260,Math.floor(fk.clientWidth||320));fk.innerHTML=wkSVG(FAKE_B.slice(0,8),w,Math.min(280,Math.max(210,Math.round(w*.42))),false)}}
let _rz;addEventListener("resize",()=>{cancelAnimationFrame(_rz);_rz=requestAnimationFrame(()=>{if(S.page==="stats")statsPaint()})});

/* Indicații la atingere / hover, construite cu textContent */
function tipShow(e,host,rows,title){let t=host.querySelector(".vtip");if(!t){t=document.createElement("div");t.className="vtip";host.appendChild(t)}
 document.querySelectorAll(".vtip").forEach(x=>{if(x!==t)x.hidden=true});
 t.innerHTML="";const h=document.createElement("div");h.className="tt";h.textContent=title;t.appendChild(h);
 rows.forEach(([cls,val,name])=>{const r=document.createElement("div");r.className="tr";const k=document.createElement("i");k.className=cls;const v=document.createElement("b");v.textContent=val;const nm=document.createElement("span");nm.textContent=name;r.append(k,v,nm);t.appendChild(r)});
 t.hidden=false;const hb=host.getBoundingClientRect();let x,y;
 if(e&&e.clientX!=null&&e.type!=="focus"){x=e.clientX-hb.left;y=e.clientY-hb.top}else{const tr=e.target.getBoundingClientRect();x=tr.left+tr.width/2-hb.left;y=tr.top-hb.top+20}
 const tw=t.offsetWidth,th=t.offsetHeight;let lx=x+14;if(lx+tw>hb.width-4)lx=x-tw-14;lx=Math.max(4,lx);let ly=Math.max(4,Math.min(y-th/2,hb.height-th-4));t.style.left=lx+"px";t.style.top=ly+"px"}
function tipHide(){document.querySelectorAll(".vtip").forEach(t=>{t.hidden=true});document.querySelectorAll(".wksvg").forEach(s=>s.removeAttribute("data-hot"));document.querySelectorAll(".col.on").forEach(c=>c.classList.remove("on"))}
function wkTip(e,i){const box=$("wk");if(!box||!box._D)return;const b=box._D.B[i],f=s=>{const d=new Date(s+"T00:00");return `${d.getDate()}.${pad2(d.getMonth()+1)}`};
 const svg=box.querySelector("svg");svg.setAttribute("data-hot","1");svg.querySelectorAll(".col").forEach(c=>c.classList.toggle("on",+c.dataset.i===i));
 tipShow(e,box,[["k-u",`${num(b.u)} MDL`,`Folosit · ${b.un} ${b.un===1?"produs":"produse"}`],["k-w",`${num(b.w)} MDL`,`Risipit · ${b.wn} ${b.wn===1?"produs":"produse"}`]],`${f(b.s)} – ${f(b.e)}`)}
function hbTip(e,k,v,n){const host=e.target.closest(".viz");
 tipShow(e,host,[["k-w",`${num(v)} MDL`,`${n} ${n===1?"produs aruncat":"produse aruncate"}`]],k)}

const periodL=d=>d===30?"o lună":d===90?"3 luni":d===180?"6 luni":d===365?"un an":`${d} zile`;
PAGES.premium=function(){const m=ME(),P=prem(),plans=S.plans.filter(p=>p.on);

 `<div class="atabs" role="tablist">${tabs.map(([k,l,ic])=>`<button role="tab" aria-selected="${S.atab===k}" onclick="S.atab='${k}';save();draw()">${I(ic)}${l}</button>`).join("")}</div>`+ATAB_FN[S.atab]()};
const auditRows=l=>l.length?`<ul class="alist audit">${l.map(a=>`<li><span class="small muted nowrap">${fmtTs(a.t)}</span><span class="grow"><b>${esc(a.by)}</b> <span class="tag">${esc(ROLE_L[a.r]||a.r)}</span><br>${esc(a.m)}</span></li>`).join("")}</ul>`:`<p class="muted">Nicio activitate înregistrată.</p>`;

/* ---------- Prezentare ---------- */
ATAB_FN.ov=function(){const me=ME(),all=S.recipes,pub=all.filter(r=>r.status!=="hid").length,hid=all.length-pub,
 act=S.accounts.filter(a=>a.plan==="premium"&&a.until&&a.until>=todayS()&&RANK[a.role]<2).length,
 soon=S.accounts.filter(a=>a.plan==="premium"&&a.until&&a.until>=todayS()&&daysLeft(a.until)<=7&&RANK[a.role]<2).length,
 blk=S.accounts.filter(a=>a.blocked).length;
 const log=RANK[me.role]>=3?S.audit.slice(0,12):S.audit.filter(a=>a.by===me.name).slice(0,12);
 return `<div class="stats4">
  <div class="card stat"><span class="ic g">${I("grid")}</span><span><small>Rețete publicate</small><b>${pub}</b>${hid?`<small>${hid} ascunse</small>`:""}</span></div>
  <div class="card stat"><span class="ic g">${I("users")}</span><span><small>Conturi</small><b>${S.accounts.length}</b>${blk?`<small>${blk} blocate</small>`:""}</span></div>
  <div class="card stat"><span class="ic h">${I("crown")}</span><span><small>Premium active</small><b>${act}</b>${soon?`<small>${soon} expiră în 7 zile</small>`:""}</span></div>
  <div class="card stat"><span class="ic r">${I("ban")}</span><span><small>Blocări (IP / email)</small><b>${S.blocked.length}</b></span></div></div>
 <div class="panels">
 <div class="card panel"><h3>Pregătire pentru lansare</h3><p class="small muted">Caietul de sarcini cere cel puțin 100 de rețete la lansare.</p>
  <div class="meter lg" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(100,pub)}" aria-label="Rețete publicate"><i style="width:${Math.min(100,pub)}%"></i></div>
  <p><b>${pub}</b> din 100 de rețete publicate${pub<100?`. Mai sunt de adăugat ${100-pub}.`:". Obiectiv atins."}</p></div>
 <div class="card panel"><h3>Drepturile tale</h3><div class="chips">${perms().map(p=>`<span class="tag">${PERM_L[p]}</span>`).join("")||`<span class="muted">Niciun drept special.</span>`}</div>
  <p class="small muted">Verificările se fac la fiecare acțiune. Tabelul de roluri și drepturi este în fila Utilizatori.</p></div>
 <div class="card panel wide"><h3>${RANK[me.role]>=3?"Activitate recentă":"Activitatea ta recentă"}</h3>${auditRows(log)}</div></div>`};

/* ---------- Rețete ---------- */
ATAB_FN.rec=function(){const q=AQ.trim().toLowerCase();
 const l=S.recipes.filter(r=>(AST==="all"||(AST==="hid")===(r.status==="hid"))&&(!q||r.n.toLowerCase().includes(q)||r.i.some(x=>x[0].includes(q))));
 return `<div class="toolbar"><label class="search" style="max-width:280px">${I("search")}<input type="search" id="aq" placeholder="Caută în rețete…" value="${esc(AQ)}" oninput="AQ=this.value;draw();const e=$('aq');e.focus();e.setSelectionRange(e.value.length,e.value.length)" aria-label="Caută în rețete"></label>
  <div class="chips">${[["all","Toate"],["pub","Publicate"],["hid","Ascunse"]].map(([v,t])=>`<button class="chip" aria-pressed="${AST===v}" onclick="AST='${v}';draw()">${t}</button>`).join("")}</div>
  <span class="rowacts" style="margin-left:auto"><button class="btn" onclick="aiImport()">${I("spark")}Import cu AI</button><button class="btn primary" onclick="recEdit(null)">${I("plus")}Rețetă nouă</button></span></div>
 <p class="small muted">${l.length} din ${S.recipes.length} rețete</p>
 ${l.length?`<div class="card tablewrap"><ul class="alist big">${l.map(r=>`<li><span class="thumb imgw">${tile(r)}${imgRepBtn("recipe",r.id,true)}</span>
  <span class="grow"><b>${esc(r.n)}</b>${r.status==="hid"?` <span class="tag">Ascunsă</span>`:""}<br><span class="small muted">${(r.cat||[]).join(", ")||"fără categorie"} · ${r.t} min · ${r.i.length} ingrediente</span></span>
  <span class="rowacts"><button class="btn sm" onclick="recEdit('${r.id}')">${I("edit")}Editează</button><button class="btn sm" onclick="recToggle('${r.id}')">${I(r.status==="hid"?"eye":"eyeoff")}${r.status==="hid"?"Publică":"Ascunde"}</button><button class="iconbtn" onclick="recDel('${r.id}')" aria-label="Șterge ${esc(r.n)}">${I("trash")}</button></span></li>`).join("")}</ul></div>`
 :`<div class="empty">Nicio rețetă nu se potrivește.</div>`}`};
function recToggle(id){if(!need("recipes"))return;const r=byId(id);if(!r)return;r.status=r.status==="hid"?"pub":"hid";audit(`A ${r.status==="hid"?"ascuns":"publicat"} rețeta „${r.n}”`);save();draw();toast(r.status==="hid"?"Rețeta este ascunsă":"Rețeta este publică")}
function recDel(id){if(!need("recipes"))return;const r=byId(id);if(!r)return;
 ask("Ștergi rețeta?",`„${esc(r.n)}” se șterge definitiv. Dacă vrei doar să nu fie vizibilă, folosește „Ascunde”.`,"Șterge rețeta",()=>{if(!need("recipes"))return;S.recipes=S.recipes.filter(x=>x.id!==id);audit(`A șters rețeta „${r.n}”`);save();draw();toast("Rețeta a fost ștearsă")},true)}
let RIMG={ph:null,img:"cooking",photo:null};
const ingText=r=>(r?r.i:[]).map(([n,q,u])=>`${n}${q!==""&&q!=null?" "+q:""}${u?" "+u:""}`).join("\n");
function parseIng(t){return String(t||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.*?)\s+(\d+(?:[.,]\d+)?)\s*(.*)$/);return m?[m[1].trim().toLowerCase(),+m[2].replace(",","."),m[3].trim()]:[l.toLowerCase(),"",""]})}
function recEdit(id){if(!need("recipes"))return;const r=id?byId(id):null;if(id&&!r)return;
 RIMG=r?{ph:r.ph||null,img:r.img||null,photo:r.photo||null}:{ph:null,img:"cooking",photo:null};
 const sel=(k,v)=>RIMG[k]===v;
 openModal(`<div class="sheet-b"><div style="padding-right:36px"><p class="eyebrow">${r?"Editezi rețeta":"Rețetă nouă"}</p><h2 style="font-size:22px">${r?esc(r.n):"Adaugă o rețetă"}</h2></div>
 <form class="stack" onsubmit="event.preventDefault();recSave(${r?`'${r.id}'`:"null"})" novalidate>
  <label class="lbl">Nume<input id="rn" class="field" maxlength="90" value="${r?esc(r.n):""}"></label>
  <label class="lbl">Descriere scurtă<input id="rd" class="field" maxlength="240" value="${r?esc(r.d||""):""}"></label>
  <div class="lbl">Imagine${canGallery(r)?"":`<p class="small muted">Imaginea rețetelor adăugate de alții o pot schimba doar moderatorii și administratorii.</p>`}<div class="gallery big" id="rgal" ${canGallery(r)?"":"hidden"}>${PHOTOS.filter(p=>!["hero","premium"].includes(p)).map(p=>`<button type="button" data-k="ph" data-v="${p}" aria-pressed="${sel("ph",p)&&!RIMG.photo}" onclick="rPick('ph','${p}',this)" aria-label="Fotografie ${p.replace(/-/g," ")}"><img src="${IM("photo/"+p+".jpg")}" alt=""></button>`).join("")}
   ${ICON_LIST.map(g=>`<button type="button" class="ic" data-k="img" data-v="${g}" aria-pressed="${sel("img",g)&&!RIMG.photo&&!RIMG.ph}" onclick="rPick('img','${g}',this)" aria-label="${g.replace(/_/g," ")}"><img src="${IM("img/"+g+".png")}" alt="" loading="lazy"></button>`).join("")}</div>
   <div class="rowacts">${canPhoto(r)?`<label class="btn sm">${I("upload")}Încarcă o fotografie<input type="file" accept="image/*" hidden onchange="rUp(this)"></label>`:`<span class="small muted">Fotografii noi poți încărca doar la rețetele adăugate de tine. Pentru aceasta poți alege o imagine din galerie.</span>`}${r&&r.photo?`<span class="small muted" id="rphn">Fotografie încărcată de tine este folosită acum.</span>`:`<span class="small muted" id="rphn"></span>`}</div></div>
  <div class="form"><label class="lbl">Minute<input id="rt" class="field w90" type="number" min="1" max="1440" value="${r?r.t:30}"></label><label class="lbl">Porții<input id="rp2" class="field w90" type="number" min="1" max="50" value="${r?r.por:4}"></label>
   <label class="lbl">Dificultate<select id="rdf" class="field">${["Ușor","Mediu","Avansat"].map(d=>`<option ${r&&r.dif===d?"selected":""}>${d}</option>`).join("")}</select></label>
   <label class="lbl">Stare<select id="rst" class="field"><option value="pub" ${!r||r.status!=="hid"?"selected":""}>Publicată</option><option value="hid" ${r&&r.status==="hid"?"selected":""}>Ascunsă</option></select></label></div>
  <div class="cats">${RCATS_ALL.map(c=>`<label><input type="checkbox" class="rcat" value="${c}" ${r&&(r.cat||[]).includes(c)?"checked":""}>${c}</label>`).join("")}<label><input type="checkbox" id="rveg" ${r&&r.veg?"checked":""}>Vegetariană</label></div>
  <div class="form"><label class="lbl">kcal<input id="rk" class="field w90" type="number" min="0" value="${r?r.k:""}"></label><label class="lbl">Proteine (g)<input id="rp" class="field w90" type="number" min="0" value="${r?r.p:""}"></label><label class="lbl">Carbohidrați (g)<input id="rc" class="field w90" type="number" min="0" value="${r?r.c:""}"></label><label class="lbl">Grăsimi (g)<input id="rf" class="field w90" type="number" min="0" value="${r?r.f:""}"></label></div>
  <label class="lbl">Ingrediente, câte unul pe rând (nume cantitate unitate)<textarea id="ri" class="field" rows="5" placeholder="roșii 500 g&#10;ouă 4 buc&#10;usturoi 2 căței">${esc(ingText(r))}</textarea></label>
  <label class="lbl">Pași, câte unul pe rând<textarea id="rs" class="field" rows="5">${esc(r?r.s.join("\n"):"")}</textarea></label>
  <p class="err" id="rerr" role="alert"></p>
  <div class="rowacts"><button class="btn primary">${r?"Salvează modificările":"Publică rețeta"}</button><button type="button" class="btn" onclick="closeModal()">Renunță</button></div></form></div>`,0,"#rn")}
function rPick(k,v,btn){RIMG={ph:null,img:null,photo:null};RIMG[k]=v;$("rgal").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===btn));$("rphn").textContent=""}
function rUp(inp){optimizeImg(inp.files[0],1200,u=>{RIMG={ph:null,img:null,photo:u};$("rgal").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed","false"));$("rphn").textContent="Fotografia încărcată va fi folosită."})}
function recSave(id){if(!need("recipes"))return;const er=$("rerr");er.textContent="";
 const n=$("rn").value.trim(),i=parseIng($("ri").value),s=$("rs").value.split("\n").map(x=>x.trim()).filter(Boolean),t=Math.round(+$("rt").value),por=Math.round(+$("rp2").value);
 if(n.length<2){er.textContent="Scrie numele rețetei.";return}
 if(!i.length){er.textContent="Adaugă cel puțin un ingredient.";return}
 if(!(t>=1)||!(por>=1)){er.textContent="Timpul și numărul de porții trebuie să fie cel puțin 1.";return}
 if(S.recipes.some(x=>x.id!==id&&x.n.toLowerCase()===n.toLowerCase())){er.textContent="Există deja o rețetă cu acest nume.";return}
 const nums=["rk","rp","rc","rf"].map(k=>Math.max(0,Math.round(+$(k).value||0)));
 const data={n,d:$("rd").value.trim(),t,por,dif:$("rdf").value,status:$("rst").value,cat:[...document.querySelectorAll(".rcat:checked")].map(x=>x.value),veg:$("rveg").checked?1:0,
  k:nums[0],p:nums[1],c:nums[2],f:nums[3],i,s:s.length?s:["Pașii vor fi adăugați în curând."],ph:RIMG.ph||undefined,img:RIMG.img||undefined,photo:RIMG.photo||undefined};
 let r=id&&byId(id);
 if(r){Object.keys(data).forEach(k=>{if(data[k]===undefined)delete r[k];else r[k]=data[k]});audit(`A modificat rețeta „${n}”`)}
 else{r={id:"c-"+Date.now().toString(36),created:todayS(),by:S.uid,...data};Object.keys(r).forEach(k=>r[k]===undefined&&delete r[k]);S.recipes.unshift(r);audit(`A adăugat rețeta „${n}”`)}
 let np=0;i.forEach(([nm])=>{if(!S.products[nm]){S.products[nm]={cat:"Altele",img:null,p:0,u:"buc"};np++}});
 save();closeModal();toast(np?`Rețeta a fost salvată. Am adăugat ${np} produse noi în bază.`:"Rețeta a fost salvată")}

const ROLE_S={moderator:"Moderator",admin:"Admin",super:"Principal"};
/* ---------- Produse ---------- */
let PNEWIMG=null;
const PUNITS=["kg","l","buc","g","ml","legătură","cap","conservă"];
ATAB_FN.prod=function(){const q=PQ.trim().toLowerCase(),use={};S.recipes.forEach(r=>r.i.forEach(x=>{use[x[0]]=(use[x[0]]||0)+1}));
 const l=allProducts().filter(n=>(PCAT==="Toate"||S.products[n].cat===PCAT)&&(!q||n.includes(q))),shown=l.slice(0,PLIM);
 return `<div class="card addpanel"><p class="h3">Produs nou</p><form class="form" onsubmit="event.preventDefault();prodAdd()">
  <label class="lbl grow">Nume<input id="pn" class="field" maxlength="40" placeholder="ex. dovlecei" required></label>
  <label class="lbl">Categorie<select id="pc" class="field">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></label>
  <label class="lbl">Preț estimat (MDL)<input id="pp" class="field w90" type="number" min="0" step="0.5" value="0"></label>
  <label class="lbl">Pe unitate<select id="pu" class="field">${PUNITS.map(u=>`<option>${u}</option>`).join("")}</select></label>
  <div class="lbl">Pictogramă<button type="button" class="btn sm picbtn" id="pnicon" onclick="prodIcon(null)">${PNEWIMG?`<img src="${IM("img/"+PNEWIMG+".png")}" alt="">`:""}Alege</button></div>
  <button class="btn primary">${I("plus")}Adaugă</button></form></div>
 <div class="toolbar"><label class="search" style="max-width:260px">${I("search")}<input type="search" id="pq" placeholder="Caută produs…" value="${esc(PQ)}" oninput="PQ=this.value;PLIM=60;draw();const e=$('pq');e.focus();e.setSelectionRange(e.value.length,e.value.length)" aria-label="Caută produs"></label>
  <div class="chips">${["Toate",...CATS].map(c=>`<button class="chip" aria-pressed="${PCAT===c}" onclick="PCAT='${c}';PLIM=60;draw()">${c}</button>`).join("")}</div></div>
 <p class="small muted">${l.length} din ${allProducts().length} produse. Prețurile sunt estimări pentru valoarea frigiderului și a listei.</p>
 <div class="card tablewrap"><ul class="alist big">${shown.map(n=>{const p=S.products[n];return `<li><button class="picbtn" onclick="prodIcon(${jsq(n)})" aria-label="Schimbă pictograma pentru ${esc(n)}">${thumb(n)}</button>
  <span class="grow"><b>${esc(n)}</b><br><span class="small muted">${use[n]?`în ${use[n]} ${use[n]===1?"rețetă":"rețete"}`:"nefolosit în rețete"}</span></span>
  <select class="field sm" aria-label="Categorie pentru ${esc(n)}" onchange="prodSet(${jsq(n)},'cat',this.value)">${CATS.map(c=>`<option ${p.cat===c?"selected":""}>${c}</option>`).join("")}</select>
  <input class="field sm w90" type="number" min="0" step="0.5" value="${p.p}" aria-label="Preț pentru ${esc(n)}" onchange="prodSet(${jsq(n)},'p',this.value)">
  <select class="field sm" aria-label="Unitate pentru ${esc(n)}" onchange="prodSet(${jsq(n)},'u',this.value)">${PUNITS.map(u=>`<option ${p.u===u?"selected":""}>${u}</option>`).join("")}</select>
  <button class="iconbtn" onclick="prodDel(${jsq(n)})" aria-label="Șterge ${esc(n)}">${I("trash")}</button></li>`}).join("")}</ul></div>
 ${l.length>shown.length?`<button class="btn" onclick="PLIM+=60;draw()">Arată încă ${Math.min(60,l.length-shown.length)}</button>`:""}`};
function prodSet(n,k,v){if(!need("products"))return;const p=S.products[n];if(!p)return;
 if(k==="p"){v=Math.max(0,Math.round((+v||0)*10)/10)}
 p[k]=v;audit(`A modificat produsul „${n}”`);save();if(k==="cat")draw();toast("Salvat")}
function prodAdd(){if(!need("products"))return;const n=$("pn").value.trim().toLowerCase();
 if(n.length<2)return toast("Scrie numele produsului.");if(S.products[n])return toast("Acest produs există deja.");
 S.products[n]={cat:$("pc").value,img:PNEWIMG,p:Math.max(0,Math.round((+$("pp").value||0)*10)/10),u:$("pu").value};PNEWIMG=null;audit(`A adăugat produsul „${n}”`);save();draw();toast(`Am adăugat ${n}`)}
function prodDel(n){if(!need("products"))return;ask("Ștergi produsul?",`„${esc(n)}” dispare din baza de produse. Rețetele care îl folosesc rămân neschimbate.`,"Șterge produsul",()=>{if(!need("products"))return;delete S.products[n];audit(`A șters produsul „${n}”`);save();draw();toast("Produs șters")},true)}
function prodIcon(n){if(n!==null&&!need("products"))return;
 openModal(`<div class="sheet-b"><div style="padding-right:36px"><h2 style="font-size:21px">Alege pictograma</h2>${n?`<p class="muted small">Pentru: ${esc(n)}</p>`:""}</div>
 <div class="gallery big"><button type="button" onclick="prodIconSet(${jsq(n)},null)" aria-label="Fără pictogramă (litera)"><span class="tph" style="width:100%;height:100%;font-size:11px">Aa</span></button>${ICON_LIST.map(g=>`<button type="button" class="ic" onclick="prodIconSet(${jsq(n)},'${g}')" aria-label="${g.replace(/_/g," ")}"><img src="${IM("img/"+g+".png")}" alt="" loading="lazy"></button>`).join("")}</div></div>`,0)}
function prodIconSet(n,g){if(n===null){PNEWIMG=g;closeModal();return}if(!need("products"))return;S.products[n].img=g;audit(`A schimbat pictograma produsului „${n}”`);save();closeModal();toast("Pictogramă salvată")}

/* ---------- Utilizatori ---------- */
ATAB_FN.usr=function(){const me=ME(),q=UQ.trim().toLowerCase();
 const l=S.accounts.filter(a=>(!q||a.name.toLowerCase().includes(q)||a.email.includes(q))&&(UF==="all"||(UF==="prem"&&hasPrem(a)&&RANK[a.role]<2)||(UF==="staff"&&RANK[a.role]>=2)||(UF==="blk"&&a.blocked)));
 const ro=Object.keys(ROLE_DEF);
 return `<div class="toolbar"><label class="search" style="max-width:280px">${I("search")}<input type="search" id="uq" placeholder="Caută după nume sau email…" value="${esc(UQ)}" oninput="UQ=this.value;draw();const e=$('uq');e.focus();e.setSelectionRange(e.value.length,e.value.length)" aria-label="Caută utilizator"></label>
  <div class="chips">${[["all","Toți"],["prem","Premium"],["staff","Echipă"],["blk","Blocați"]].map(([v,t])=>`<button class="chip" aria-pressed="${UF===v}" onclick="UF='${v}';draw()">${t}</button>`).join("")}</div></div>
 <p class="small muted">${l.length} din ${S.accounts.length} conturi</p>
 <div class="card tablewrap"><ul class="alist big users">${l.map(a=>{const mg=canManage(a),self=a.id===me.id,pl=premLeft(a);
  return `<li class="${a.blocked?"blocked":""}"><span class="avatar" style="width:38px;height:38px">${esc(initials(a.name))}</span>
  <span class="grow"><b>${esc(a.name)}</b>${self?` <span class="tag">Tu</span>`:""}${a.blocked?` <span class="tag red">Blocat</span>`:""}<br><span class="small muted">${esc(a.email)} · cont din ${fmtDate(a.created)}</span></span>
  <select class="field sm" aria-label="Rol pentru ${esc(a.name)}" ${mg?"":"disabled"} onchange="roleChange('${a.id}',this.value)">${ro.map(r=>`<option value="${r}" ${a.role===r?"selected":""} ${r===a.role||assignable().includes(r)?"":"disabled"}>${ROLE_L[r]}</option>`).join("")}</select>
  <span class="small plancol">${a.famGrant&&RANK[a.role]<2?`<span class="tag">Familie activată manual</span> `:""}${a.role==="trainer"?`Antrenor · ${a.students!=null?a.students:studentsOf(a.id).length} studenți · `:""}${RANK[a.role]>=2?"inclus în echipă":hasPrem(a)?`Premium${a.until?` · până la ${fmtDate(a.until)}${pl!=null&&pl<=7?" (expiră curând)":""}`:""}`:"Plan gratuit"}</span>
  <span class="rowacts">${mg&&RANK[a.role]<2?`<button class="btn sm" onclick="premModal('${a.id}')">${I("crown")}Premium</button><button class="btn sm" aria-pressed="${!!a.famGrant}" onclick="famGrantUI('${a.id}')">${I("users")}${a.famGrant?"Oprește familia":"Activează familia"}</button>`:""}${mg&&extraTarget(a)&&(GRANT[me.role]||[]).length?`<button class="btn sm" onclick="permModal('${a.id}')">${I("key")}Drepturi</button>`:""}

async function aiGo(){

 AIX.busy=true;AIX.err=null;AIX.res=null;AIX.step=0;aiDraw();
 clearInterval(AIX.timer);AIX.timer=setInterval(()=>{if(AIX.step<AI_STEPS.length-1){AIX.step++;aiDraw()}},2600);
 const r=await api("/ai/recipe",{method:"POST",body:{input:v}});
 clearInterval(AIX.timer);AIX.busy=false;
 if(r.ok&&r.data&&r.data.import){AIX.res=r.data.import;AIX.input="";recSet(r.data.import.recipe);persist();toast("Rețeta a fost importată și salvată (ascunsă)")}
 else AIX.err=(r.data&&r.data.error)||"Importul nu a reușit. Încearcă din nou.";

 aiDraw();aiHist();if(S.page==="admin")draw()}

 <div class="aicols">

const mealsCount=m=>m.days.reduce((n,d)=>n+Object.keys(d.m).length,0);
function menuCard(m,tr){const u=acct(tr?m.st:m.tr);
 return `<div class="card mcard"><div><p class="eyebrow">${esc(tr?"Pentru":"De la")} ${esc(u?u.name:"")}</p><h3>${esc(m.title)}</h3><p class="small muted">${m.days.length} ${m.days.length===1?"zi":"zile"} · ${mealsCount(m)} mese · actualizat ${fmtDate(m.updated)}</p></div>
  <div class="rowacts"><button class="btn sm primary" onclick="CMENU='${m.id}';draw();scrollTo({top:0})">Deschide</button>${tr?`<button class="btn sm" onclick="copyModal('${m.id}')">${I("copy")}Copiază</button>`:""}</div></div>`}
function menuNewUI(sid){const st=myStudents();if(!st.length)return toast("Adaugă mai întâi un student în grup.");
 openModal(`<div class="sheet-b"><div style="padding-right:36px"><p class="eyebrow">Meniu nou</p><h2 style="font-size:22px">Creează un meniu</h2></div>
 <form class="stack" onsubmit="event.preventDefault();menuNewGo()" novalidate>
  <label class="lbl">Studentul<select id="mst" class="field">${st.map(u=>`<option value="${u.id}" ${u.id===sid?"selected":""}>${esc(u.name)}</option>`).join("")}</select></label>
  <label class="lbl">Titlul meniului<input id="mtt" class="field" maxlength="80" placeholder="ex. Slăbire sănătoasă · săptămâna 1"></label>
  <label class="lbl">Număr de zile<select id="mnd" class="field">${[1,2,3,4,5,6,7,10,14].map(n=>`<option ${n===7?"selected":""}>${n}</option>`).join("")}</select></label>
  <label class="lbl">Indicații pentru student (opțional)<textarea id="mnt" class="field" rows="3" maxlength="600" placeholder="ex. Bea cel puțin 2 litri de apă pe zi."></textarea></label>
  <div class="rowacts"><button class="btn primary">Creează meniul</button><button type="button" class="btn" onclick="closeModal()">Renunță</button></div></form></div>`,1,"#mtt")}
function menuNewGo(){const m=menuCreate($("mst").value,$("mtt").value,$("mnd").value,$("mnt").value);if(m){CTAB="men";CMENU=m.id;closeModal();toast("Meniul a fost creat. Adaugă mesele pentru fiecare zi.")}}
function menuView(m,tr){if(!m)return"";const u=acct(tr?m.st:m.tr);
 return `<button class="link back" onclick="CMENU=null;draw()">${I("arrow")}Toate meniurile</button>
 <div class="card panel menuhead"><div class="grow"><p class="eyebrow">${tr?"Meniu pentru":"Meniu de la"} ${esc(u?u.name:"")} · confidențial</p><h2>${esc(m.title)}</h2>${m.note?`<p class="muted">${esc(m.note)}</p>`:""}
  <p class="small muted">${m.days.length} ${m.days.length===1?"zi":"zile"} · ${mealsCount(m)} mese · actualizat ${fmtDate(m.updated)}</p></div>
  <div class="rowacts">${tr?`<button class="btn sm primary" onclick="copyModal('${m.id}')">${I("copy")}Copiază pentru alt student</button><button class="btn sm" onclick="menuEditUI('${m.id}')">${I("edit")}Detalii</button><button class="btn sm" onclick="menuAddDay('${m.id}')&&draw()">${I("plus")}Adaugă o zi</button><button class="iconbtn" onclick="menuDelUI('${m.id}')" aria-label="Șterge meniul">${I("trash")}</button>`
   :`<button class="btn sm primary" onclick="menuPlanUI('${m.id}')">${I("cal")}Adaugă în planificator</button>`}</div></div>
 <div class="week mweek">${m.days.map((d,di)=>`<div class="card day"><div class="day-h"><b>Ziua ${di+1}</b>${tr&&m.days.length>1?`<button class="slotx" style="position:static" onclick="menuDelDay('${m.id}',${di})&&draw()" aria-label="Șterge ziua ${di+1}">${I("x")}</button>`:""}</div>
  ${menuSlots(d).map(x=>{const v=d.m[x];if(!tr&&!v)return"";const r=v&&v.r&&rec(v.r),s=r&&rsrc(r);
   const body=r?`<span class="pick">${s?`<img src="${s.u}" class="${s.photo?"":"ill"}" alt="">`:""}<span>${esc(r.n)}</span></span>`:v&&v.t?`<span class="pick txt"><span>${esc(v.t)}</span></span>`:`<span class="slot-add">${I("plus")}Adaugă</span>`;
   return `<div class="slotw ${isExtra(x)?"extra":""}"><button class="slot" onclick="${tr?`menuPick('${m.id}',${di},'${x}')`:r?`openRecipe('${r.id}')`:""}"><small>${x}</small>${body}</button>${tr&&isExtra(x)?`<button class="slotx" onclick="menuDelSlot('${m.id}',${di},'${x}')&&draw()" aria-label="Șterge ${x}">${I("x")}</button>`:""}</div>`}).join("")}
  ${tr?`<div class="addmeal"><button class="link" onclick="menuAddSlot('${m.id}',${di},'Gustare')&&draw()">${I("plus")}Gustare</button><button class="link" onclick="menuAddSlot('${m.id}',${di},'Chindie')&&draw()">${I("plus")}Chindie</button></div>`:""}</div>`).join("")}</div>`}
function menuPick(id,di,key){const m=ownMenu(id);if(!m)return;const cur=m.days[di].m[key]||{};
 const l=recipes().slice().sort((a,b)=>fitsMeal(b,key)-fitsMeal(a,key)||a.n.localeCompare(b.n,"ro"));
 openModal(`<div class="sheet-b"><div style="padding-right:36px"><p class="eyebrow">Ziua ${di+1} · ${key}</p><h2 style="font-size:22px">Alege o rețetă sau scrie masa</h2></div>
 <form class="form" onsubmit="event.preventDefault();if(menuSetMeal('${id}',${di},'${key}',{t:$('mtx').value})){closeModal();toast('Masa a fost salvată')}"><label class="lbl grow">Text liber (ex. Iaurt grecesc 150 g și nuci)<input id="mtx" class="field" maxlength="160" value="${esc(cur.r?"":cur.t||"")}"></label><button class="btn primary">Salvează</button></form>
 <ul class="plist">${l.map(r=>`<li><button onclick="menuSetMeal('${id}',${di},'${key}',{r:'${r.id}'})&&closeModal()"><span class="thumb">${tile(r)}</span><span style="flex:1"><b>${esc(r.n)}</b><br><span class="small muted">${r.t} min · ${r.k} kcal</span></span>${r.id===cur.r?I("checkc"):""}</button></li>`).join("")}</ul>
 ${cur.r||cur.t?`<button class="btn" onclick="menuSetMeal('${id}',${di},'${key}',null)&&closeModal()">${I("trash")}Golește masa</button>`:""}</div>`,0,"#mtx")}
function menuEditUI(id){const m=ownMenu(id);openModal(`<div class="sheet-b"><h2 style="font-size:21px;padding-right:36px">Detaliile meniului</h2><form class="stack" onsubmit="event.preventDefault();if(menuUpdate('${id}',$('mtt').value,$('mnt').value)){closeModal();toast('Meniul a fost salvat')}" novalidate>
 <label class="lbl">Titlu<input id="mtt" class="field" maxlength="80" value="${esc(m.title)}"></label><label class="lbl">Indicații pentru student<textarea id="mnt" class="field" rows="4" maxlength="600">${esc(m.note)}</textarea></label>
 <div class="rowacts"><button class="btn primary">Salvează</button><button type="button" class="btn" onclick="closeModal()">Renunță</button></div></form></div>`,1,"#mtt")}
function menuDelUI(id){const m=ownMenu(id);ask("Ștergi meniul?",`„${esc(m.title)}” se șterge și pentru student.`,"Șterge meniul",()=>{if(menuDelete(id)){CMENU=null;draw();toast("Meniul a fost șters")}},true)}
function copyModal(id){const m=ownMenu(id);if(!m)return;COPYSENT=COPYSENT.filter(x=>x.startsWith(id+":"));const others=myStudents().filter(u=>u.id!==m.st);
 openModal(`<div class="sheet-b"><div style="padding-right:36px"><p class="eyebrow">Copiere rapidă</p><h2 style="font-size:22px">Trimite „${esc(m.title)}” altui student</h2></div>
 <p class="small muted">Studentul primește o copie a meniului, pe care o poți modifica separat. Originalul rămâne neschimbat.</p>
 ${others.length?`<ul class="alist flat">${others.map(u=>{const sent=COPYSENT.includes(id+":"+u.id);return `<li><span class="avatar ${stTone(u.id)}">${esc(initials(u.name))}</span><span class="grow"><b>${esc(u.name)}</b><br><span class="small muted">${esc(u.email)}</span></span>
  <button class="btn sm ${sent?"":"primary"}" ${sent?"disabled":""} onclick="copyGo('${id}','${u.id}')">${sent?`${I("check")}Trimis`:`${I("copy")}Trimite`}</button></li>`}).join("")}</ul>`:`<p class="muted">Nu ai alți studenți în grup.</p>`}</div>`,1)}
function copyGo(id,sid){const c=menuCopy(id,sid);if(c){COPYSENT.push(id+":"+sid);toast(`Meniul a fost trimis lui ${acct(sid).name}`);copyModal(id)}}
function menuPlanUI(id){const nm=iso(addD(monday(),7));
 openModal(`<div class="sheet-b"><h2 style="font-size:21px;padding-right:36px">Adaugă meniul în planificator</h2><p class="muted small">Rețetele din meniu se pun în planificatorul tău, începând cu ziua aleasă. Mesele scrise ca text rămân doar în meniu.</p>
 <form class="form" onsubmit="event.preventDefault();const n=menuToPlan('${id}',$('mps').value);if(n!==false){closeModal();toast(n?'Am adăugat '+n+' mese în planificator':'Meniul nu are rețete de adăugat')}"><label class="lbl grow">Începând cu<input id="mps" class="field" type="date" value="${todayS()}"></label><button class="btn primary">Adaugă</button></form>
 <div class="rowacts"><button class="link" onclick="$('mps').value='${nm}'">Luni viitoare (${fmtDate(nm)})</button></div></div>`,1,"#mps")}

/* ======== Cabinetul studentului ======== */
function studentPage(){const tr=trainersOf(S.uid),mm=myMenus().filter(m=>m.st===S.uid);
 if(CMENU&&!mm.some(m=>m.id===CMENU))CMENU=null;
 const tabs=[["men","Meniurile mele","grid"],["cal","Calendarul meu","cal"]];
 return pagehead("Antrenorul meu",tr.map(t=>esc(t.name)).join(", ")+` · ${mm.length} ${mm.length===1?"meniu":"meniuri"} pentru tine`)+
  `<div class="atabs ctabs" role="tablist">${tabs.map(([k,l,ic])=>`<button role="tab" aria-selected="${STAB===k}" onclick="STAB='${k}';CMENU=null;draw()">${I(ic)}${l}</button>`).join("")}</div>`+
  (STAB==="cal"?calendarView(false):CMENU?menuView(mm.find(m=>m.id===CMENU),false):
   `<p class="small muted">Meniurile sunt doar pentru tine: le vezi tu și antrenorul tău.</p>${mm.length?`<div class="mcards">${mm.map(m=>menuCard(m,false)).join("")}</div>`:`<div class="empty"><img src="${IM("img/curry_rice.png")}" alt="">Antrenorul tău nu ți-a trimis încă un meniu.</div>`}`)}

/* ======== Calendar (zi / săptămână / lună) ======== */
function sessInRange(a,b){return mySessions().filter(x=>x.d>=a&&x.d<=b).sort((x,y)=>(x.d+x.s).localeCompare(y.d+y.s))}
function calRange(){const d=CAL.d||todayS();if(CAL.v==="day")return[d,d];if(CAL.v==="week"){const m=mondayOf(d);return[m,addDaysS(m,6)]}
 const x=new Date(d+"T00:00"),first=iso(new Date(x.getFullYear(),x.getMonth(),1)),last=iso(new Date(x.getFullYear(),x.getMonth()+1,0));return[first,last]}
function calMove(n){const d=CAL.d||todayS();if(CAL.v==="day")CAL.d=addDaysS(d,n);else if(CAL.v==="week")CAL.d=addDaysS(d,7*n);else{const x=new Date(d+"T00:00");CAL.d=iso(new Date(x.getFullYear(),x.getMonth()+n,1))}draw()}
function calTitle(){const [a,b]=calRange(),A=new Date(a+"T00:00"),B=new Date(b+"T00:00");
 if(CAL.v==="day")return dateL(a);if(CAL.v==="month")return `${MONTHS[A.getMonth()]} ${A.getFullYear()}`;
 return A.getMonth()===B.getMonth()?`${A.getDate()} – ${B.getDate()} ${MONTHS[B.getMonth()]} ${B.getFullYear()}`:`${A.getDate()} ${MONTHS[A.getMonth()]} – ${B.getDate()} ${MONTHS[B.getMonth()]} ${B.getFullYear()}`}
function calendarView(tr){const [a,b]=calRange(),l=sessInRange(a,b),tot=l.reduce((n,x)=>n+x.dur,0),who=new Set(l.map(x=>tr?x.st:x.tr)).size;
 const views=[["day","Zi"],["week","Săptămână"],["month","Lună"]];
 const up=mySessions().filter(x=>x.d>=todayS()).sort((x,y)=>(x.d+x.s).localeCompare(y.d+y.s)).slice(0,6);
 return `<div class="card calcard"><div class="calbar"><div class="calnav"><button class="iconbtn" onclick="calMove(-1)" aria-label="Înapoi"><span class="flip">${I("arrow")}</span></button><button class="btn sm" onclick="CAL.d=null;draw()">Azi</button><button class="iconbtn" onclick="calMove(1)" aria-label="Înainte">${I("arrow")}</button><h3>${calTitle()}</h3></div>
  <div class="calright"><div class="seg calseg" role="tablist">${views.map(([k,t])=>`<button role="tab" aria-selected="${CAL.v===k}" onclick="CAL.v='${k}';draw()">${t}</button>`).join("")}</div>${tr?`<button class="btn sm primary" onclick="sessModal()">${I("plus")}Ședință</button>`:""}</div></div>
  <p class="calsum"><b>${l.length}</b> ${l.length===1?"ședință":"ședințe"} · <b>${durL(tot)}</b>${tr?` · <b>${who}</b> ${who===1?"student":"studenți"}`:""} în perioada afișată${tr?"":" · vezi doar orele tale"}</p>
  ${CAL.v==="month"?monthGrid(a,b,tr):timeGrid(CAL.v==="day"?[a]:[...Array(7)].map((_,i)=>addDaysS(a,i)),tr)}</div>
  <div class="card panel"><h3>Următoarele ședințe</h3>${up.length?`<ul class="alist flat">${up.map(x=>sessRow(x,tr)).join("")}</ul>`:`<p class="muted small">Nicio ședință programată.</p>`}</div>`}
function sessLabel(x,tr){const u=acct(tr?x.st:x.tr);return tr?(u?u.name:"Student"):x.title}
function sessRow(x,tr){const u=acct(tr?x.st:x.tr);return `<li><span class="avatar ${stTone(x.st)}">${esc(initials(u?u.name:"?"))}</span><span class="grow"><b>${dateL(x.d)}, ${x.s}–${hm(mins(x.s)+x.dur)}</b><br><span class="small muted">${esc(x.title)} · ${tr?"cu ":"antrenor: "}${esc(u?u.name:"")}</span></span><button class="btn sm" onclick="sessModal('${x.id}')">${tr?"Editează":"Detalii"}</button></li>`}
function timeGrid(days,tr){const l=sessInRange(days[0],days[days.length-1]);
 const h0=Math.min(6,...l.map(x=>Math.floor(mins(x.s)/60))),h1=Math.max(22,...l.map(x=>Math.ceil((mins(x.s)+x.dur)/60))),H=52,td=todayS();
 return `<div class="calscroll"><div class="tgrid ${days.length===1?"one":""}" style="--cols:${days.length};--h:${H}px">
  <div class="tg-corner"></div>${days.map(k=>{const d=new Date(k+"T00:00");return `<button class="tg-day ${k===td?"today":""}" onclick="CAL.v='day';CAL.d='${k}';draw()"><small>${WD[(d.getDay()+6)%7]}</small><b>${d.getDate()}</b></button>`}).join("")}
  <div class="tg-hours">${[...Array(h1-h0)].map((_,i)=>`<span style="height:${H}px">${pad2(h0+i)}:00</span>`).join("")}</div>
  ${days.map(k=>`<div class="tg-col ${k===td?"today":""}" style="height:${(h1-h0)*H}px" ${tr?`ondblclick="sessModal(null,null,'${k}')"`:""}>${l.filter(x=>x.d===k).map(x=>{const top=(mins(x.s)-h0*60)/60*H,ht=Math.max(22,x.dur/60*H-3);
   return `<button class="ev ${stTone(x.st)} ${ht<44?"short":""}" style="top:${top}px;height:${ht}px" onclick="sessModal('${x.id}')" aria-label="${x.s}, ${esc(sessLabel(x,tr))}, ${esc(x.title)}"><b>${x.s}</b><span>${esc(sessLabel(x,tr))}</span>${ht>=60&&tr?`<small>${esc(x.title)}</small>`:""}</button>`}).join("")}</div>`).join("")}
 </div></div>${tr?`<p class="small muted">Atinge o ședință ca s-o modifici. Apasă pe o zi ca s-o vezi pe ore.</p>`:""}`}
function monthGrid(a,b,tr){const start=mondayOf(a),end=addDaysS(mondayOf(b),6),l=sessInRange(start,end),td=todayS(),days=[];
 for(let k=start;k<=end;k=addDaysS(k,1))days.push(k);const mon=a.slice(0,7);
 return `<div class="mgrid">${WD.map(w=>`<span class="mg-h">${w}</span>`).join("")}${days.map(k=>{const s=l.filter(x=>x.d===k);
  return `<button class="mg-d ${k.slice(0,7)!==mon?"out":""} ${k===td?"today":""}" onclick="CAL.v='day';CAL.d='${k}';draw()" aria-label="${dateL(k)}: ${s.length} ședințe"><span class="mg-n">${+k.slice(8)}</span>
  ${s.slice(0,3).map(x=>`<span class="mg-ev ${stTone(x.st)}">${x.s} ${esc(sessLabel(x,tr).split(" ")[0])}</span>`).join("")}${s.length>3?`<span class="mg-more">+${s.length-3}</span>`:""}</button>`}).join("")}</div>`}
function sessModal(id,sid,day){const x=id?mySessions().find(z=>z.id===id):null;if(id&&!x)return;
 const tr=isTrainer()&&(!x||x.tr===S.uid);
 if(!tr){const t=acct(x.tr);openModal(`<div class="sheet-b"><div style="padding-right:36px"><p class="eyebrow">Ședință de antrenament</p><h2 style="font-size:22px">${esc(x.title)}</h2></div>
  <div class="box"><div class="kv"><span>Ziua</span><b>${dateL(x.d)}</b></div><div class="kv"><span>Ora</span><b>${x.s}–${hm(mins(x.s)+x.dur)} (${durL(x.dur)})</b></div><div class="kv"><span>Antrenor</span><b>${esc(t?t.name:"")}</b></div></div>${x.note?`<p class="muted">${esc(x.note)}</p>`:""}</div>`,1);return}
 const st=myStudents();if(!st.length)return toast("Adaugă mai întâi un student în grup.");
 openModal(`<div class="sheet-b"><div style="padding-right:36px"><p class="eyebrow">${x?"Editezi ședința":"Ședință nouă"}</p><h2 style="font-size:22px">${x?esc(x.title):"Programează un antrenament"}</h2></div>
 <form class="stack" onsubmit="event.preventDefault();sessGo(${x?`'${x.id}'`:"null"})" novalidate>
  <label class="lbl">Studentul<select id="sst" class="field">${st.map(u=>`<option value="${u.id}" ${(x?x.st:sid)===u.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select></label>
  <div class="form"><label class="lbl">Ziua<input id="sdd" class="field" type="date" value="${x?x.d:day||CAL.d||todayS()}"></label><label class="lbl">Ora<input id="sss" class="field" type="time" step="900" value="${x?x.s:"18:00"}"></label>
  <label class="lbl">Durata<select id="sdu" class="field">${[30,45,60,75,90,120].map(n=>`<option value="${n}" ${(x?x.dur:60)===n?"selected":""}>${durL(n)}</option>`).join("")}</select></label></div>
  <label class="lbl">Titlu<input id="stt" class="field" maxlength="60" value="${esc(x?x.title:"Antrenament")}"></label>
  <label class="lbl">Notă pentru student (opțional)<textarea id="snt" class="field" rows="2" maxlength="300">${esc(x?x.note:"")}</textarea></label>
  <div class="rowacts"><button class="btn primary">${x?"Salvează":"Programează"}</button>${x?`<button type="button" class="btn danger" onclick="sessDelete('${x.id}')&&(closeModal(),toast('Ședința a fost ștearsă'))">${I("trash")}Șterge</button>`:""}<button type="button" class="btn" onclick="closeModal()">Renunță</button></div></form></div>`,1,"#sss")}
function sessGo(id){if(sessSave({id,st:$("sst").value,d:$("sdd").value,s:$("sss").value,dur:$("sdu").value,title:$("stt").value,note:$("snt").value})){CAL.d=$("sdd").value;closeModal();toast(id?"Ședința a fost salvată":"Ședința a fost programată")}}

/* ---------- Legături cu serverul care depind de paginile definite mai sus ---------- */
if(SRV){
 const oa=PAGES.admin;
 PAGES.admin=function(){if(Date.now()-ADM.at>15000)admLoad();return oa()};
}
// pagina principală, culorile și textele se publică pe server
if(SRV){
 for(const name of ["edPublish","saveTheme","saveTxt"]){const o=globalThis[name];
  globalThis[name]=function(...a){const h=JSON.stringify([S.home,S.theme,S.txt]);const r=o.apply(this,a);
   if(JSON.stringify([S.home,S.theme,S.txt])!==h)homePush();return r}}
 globalThis.askResetHome=function(){ask("Revii la pagina inițială?","Blocurile paginii principale revin la varianta de la lansare. Culorile și numele nu se schimbă.","Revino la varianta inițială",
  ()=>{if(!need("frontend"))return;S.home=clone(DEF_HOME);save();draw();homePush().then(ok=>ok&&toast("Pagina principală a fost restabilită"))},true)};
}

/* ---------- Pornire ---------- */
load();
if(SRV)srvMigrate();
applyTheme(S.theme);
HASHREADY=ensureHashes();
draw();
if(SRV)srvBoot();

</script>
