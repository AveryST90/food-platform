<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gusto: rețete după ingredientele pe care le ai, frigider virtual, liste de cumpărături, planificator de mese, conturi și administrare.">
<link rel="icon" href="img/cooking.png">
<title>Gusto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>

/* Layout: bară laterală fixă + conținut pe fundal ivory, carduri albe rotunjite. Pe telefon bara laterală devine meniu jos.
   Direcție: Fresh & Organic + Smart Kitchen, zonă Premium verde închis cu accente miere. Doar varianta luminoasă. */
:root{
  --bg:#f7f6f0; --surface:#ffffff; --soft:#f2f3ec; --line:#e6e7de; --ink:#29362d; --muted:#6c776f;
  --green:#477653; --green-dk:#355c40; --green-soft:#e7efe5; --sage:#a7be9a;
  --honey:#e7b96b; --honey-soft:#fbf2df; --honey-ink:#7a5310;
  --danger:#c2452d; --danger-soft:#fbe9e4; --warn:#c98a1b; --warn-soft:#fdf3e1;
  --premium:#1f3a2b; --premium-2:#162a1f;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --shadow:0 1px 2px rgb(41 54 45 / .04),0 4px 16px rgb(41 54 45 / .05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--green)}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;border-right:1px solid var(--line);background:var(--bg)}
.logo{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;letter-spacing:-.03em;padding:0 10px 18px;background:none;border:0;color:var(--ink)}
.logo svg{width:28px;height:28px;color:var(--green);fill:var(--green-soft)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;color:var(--muted);font-weight:600;text-align:left}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--green-soft);color:var(--green-dk)}
.nav .badge{margin-left:auto}
.side .me{margin-top:auto}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:0;background:none;text-align:left;width:100%}
.me:hover{background:var(--soft)}
.me b{display:block;font-size:14px}
.me span{font-size:12px;color:var(--muted)}
.me .avatar{color:#fff;font-size:13px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--line);color:var(--ink);font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.badge.red{background:var(--danger);color:#fff}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:center;gap:12px;padding-block:14px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
.topbar .logo{display:none;padding:0}
.search{position:relative;flex:1;max-width:460px}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--muted)}
.search input{width:100%;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 16px 0 42px}
.search input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;position:relative}
.iconbtn{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--soft)}
.iconbtn .badge{position:absolute;top:2px;right:0;min-width:17px;height:17px;font-size:10px;padding:0 4px}
.content{padding-block:8px 64px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:32px}
.pagehead{display:flex;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.pagehead h1{font-size:30px;font-weight:800;letter-spacing:-.03em}
.pagehead p{color:var(--muted);margin-top:4px}
.pagehead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* Popovers */
.pop{position:absolute;top:48px;right:0;z-index:20;width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgb(41 54 45 / .16);padding:14px;display:flex;flex-direction:column;gap:10px}
.pop h4{font-size:14px}
.pop .row{display:flex;align-items:center;gap:10px;font-size:14px}
.pop hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}

/* Controls */
.btn{height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--sage)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-dk)}
.btn.honey{background:var(--honey);border-color:var(--honey);color:#3b2a08}
.btn.ghost{background:none;border-color:transparent;color:var(--green)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
.field{height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;min-width:0}
textarea.field{height:auto;padding:10px 12px;resize:vertical}
.field:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip:hover{border-color:var(--sage)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.chip img{width:18px;height:18px}
.chip.x{background:var(--green-soft);border-color:transparent;color:var(--green-dk)}
.link{background:none;border:0;padding:0;color:var(--green);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sechead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sechead h2{font-size:20px;font-weight:800}
.sechead .link{margin-left:auto}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(110deg,#f3f5ec 0%,#eaf0e2 55%,#e3ebd9 100%);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);min-height:330px}
.hero-txt{position:relative;z-index:1;padding:40px 0 36px 40px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(30px,3.6vw,44px);line-height:1.08;font-weight:800;letter-spacing:-.035em}
.hero h1 span{display:block}
.hero p.lede{color:var(--muted);max-width:44ch;font-size:16px}
.hero-search{display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;max-width:520px;box-shadow:var(--shadow)}
.hero-search input{flex:1;min-width:0;border:0;background:none;height:40px;outline:none}
.hero-photo{position:relative}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%);mask-image:linear-gradient(90deg,transparent 0,#000 22%)}

/* Recipe cards */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.rgrid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.rgrid.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rcard{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s}
.rcard:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgb(41 54 45 / .1)}
.rcard[aria-current="true"]{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft)}
.rtile{position:relative;aspect-ratio:3/2;max-width:100%;background:radial-gradient(circle at 50% 60%,#fff 0,var(--green-soft) 75%);display:grid;place-items:center;overflow:hidden}
.rtile img.photo{width:100%;height:100%;object-fit:cover}
.rtile img.ill{width:44%;filter:drop-shadow(0 12px 14px rgb(41 54 45 / .18));transition:transform .4s}
.rcard:hover .rtile img.ill{transform:scale(1.06) rotate(-3deg)}
.rtile .ph{font-size:44px;font-weight:800;color:var(--sage)}
.heart{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgb(255 255 255 / .92);display:grid;place-items:center;color:var(--danger);box-shadow:0 2px 8px rgb(0 0 0 / .1)}
.heart svg{width:17px;height:17px}
.heart[aria-pressed="true"] svg{fill:currentColor}
.rbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.rbody h3{font-size:15px;font-weight:700;line-height:1.3}
.meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.meta svg.i{width:15px;height:15px}
.compat{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--green)}
.compat svg.i{width:16px;height:16px}
.compat.low{color:var(--muted)}

/* Recipes page */
.rlayout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.detail{position:sticky;top:84px;overflow:hidden;padding:0}
.detail .rtile{aspect-ratio:16/10}
.detail-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.detail-b h2{font-size:20px;font-weight:800}
.ilist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ilist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ilist li:last-child{border-bottom:0}
.ilist img,.ilist .tph{width:28px;height:28px;flex:none}
.ilist .n{flex:1;min-width:0}
.ilist .n small{display:block;color:var(--honey-ink);font-size:12px}
.ilist .q{color:var(--muted);white-space:nowrap}
.st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none}
.st svg{width:13px;height:13px;stroke-width:3}
.st.ok{background:var(--green);color:#fff}
.st.sub{background:var(--honey);color:#3b2a08}
.st.no{background:var(--danger-soft);color:var(--danger)}
.tph{display:inline-grid;place-items:center;border-radius:50%;background:var(--green-soft);color:var(--green);font-weight:700;font-size:12px}
.freebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--honey-soft);color:var(--honey-ink);font-size:14px;font-weight:600}
.freebar .link{color:var(--honey-ink);margin-left:auto}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .chips{flex:1;min-width:0}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Modal */
.scrim{position:fixed;inset:0;z-index:40;background:rgb(22 30 24 / .5);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .18s}
.sheet{position:relative;width:100%;max-width:880px;max-height:100%;overflow:auto;background:var(--surface);border-radius:24px;animation:rise .25s cubic-bezier(.2,.8,.2,1)}
.sheet.sm{max-width:520px}
.sheet .x{position:absolute;top:12px;right:12px;z-index:3;background:rgb(255 255 255 / .92)}
.sheet-top{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;padding:24px 28px 0;align-items:center}
.sheet-top .media{position:relative;border-radius:18px;overflow:hidden}
.sheet-top .rtile{aspect-ratio:4/3}
.sheet-top .heart{right:auto;left:10px}
.sheet-top h2{font-size:28px;font-weight:800;letter-spacing:-.03em}
.sheet-b{padding:24px 28px 28px;display:flex;flex-direction:column;gap:20px}
.sheet-b h2{font-size:28px;font-weight:800;letter-spacing:-.03em}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.facts{display:flex;gap:10px;flex-wrap:wrap}
.fact{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--soft);font-size:14px;font-weight:600}
.nut{position:relative}
.cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cells div{background:var(--soft);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column}
.cells b{font-size:18px;font-variant-numeric:tabular-nums}
.cells span{font-size:12px;color:var(--muted)}
.nut.locked .cells{filter:blur(7px);user-select:none}
.lockmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.lockmsg .btn{box-shadow:0 6px 20px rgb(0 0 0 / .12)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:12px}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--green-soft);color:var(--green-dk);font-weight:800;font-size:13px;display:grid;place-items:center}
.h3{font-size:16px;font-weight:800}
.box{padding:14px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;gap:10px}
.box.honey{background:var(--honey-soft)}
.paywall{padding:22px;border-radius:18px;background:var(--premium);color:#eef3ec;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.paywall h3{font-size:20px;color:#fff}

/* Fridge */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stat{display:flex;align-items:center;gap:14px;padding:18px}
.stat .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.stat .ic svg{width:22px;height:22px}
.stat small{display:block;color:var(--muted);font-size:13px}
.stat b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.ic.g{background:var(--green-soft);color:var(--green)}
.ic.r{background:var(--danger-soft);color:var(--danger)}
.ic.h{background:var(--honey-soft);color:var(--honey-ink)}
.fcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;align-items:start}
.fcol{padding:14px 16px 6px}
.fcol-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;padding-bottom:6px}
.fcol-h .badge{margin-left:auto}
.frow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.frow .chk{width:20px;height:20px;accent-color:var(--green);flex:none}
.frow img,.frow .tph{width:36px;height:36px;flex:none}
.frow .n{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.frow .n b{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .n>span{font-size:12px;color:var(--muted)}
.exp{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.exp::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.exp.d{color:var(--danger)} .exp.w{color:var(--warn)} .exp.o{color:var(--green)}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.qty button:hover{color:var(--ink);border-color:var(--sage)}
.qty svg.i{width:14px;height:14px}
.frow .del{width:28px;height:28px;border:0;background:none;color:var(--muted);border-radius:8px;display:grid;place-items:center}
.frow .del:hover{background:var(--danger-soft);color:var(--danger)}
.addpanel{padding:18px;display:flex;flex-direction:column;gap:12px}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.form .grow{flex:1;min-width:180px}
.lbl{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
.lbl .field{font-weight:400}
.w90{width:90px}.w120{width:130px}
.suggest{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-radius:16px;background:var(--warn-soft);border:1px solid #f3e0bb}
.suggest b{font-weight:800}
.actionbar{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;background:var(--premium);color:#fff;border-radius:16px;padding:10px 10px 10px 20px;box-shadow:0 12px 30px rgb(22 42 31 / .3);font-weight:700}

/* Shopping */
.slist{padding:6px 16px}
.srow{display:flex;align-items:center;gap:12px;min-height:56px;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow input[type="checkbox"]{appearance:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--sage);display:grid;place-items:center;flex:none;margin:0;cursor:pointer}
.srow input[type="checkbox"]:checked{background:var(--green);border-color:var(--green)}
.srow input[type="checkbox"]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;rotate:45deg;translate:0 -1px}
.srow img,.srow .tph{width:34px;height:34px;flex:none}
.srow label{flex:1;min-width:0;display:flex;flex-direction:column;cursor:pointer;line-height:1.3}
.srow label b{font-weight:700}
.srow label span{font-size:12px;color:var(--muted)}
.srow.done label b{text-decoration:line-through;color:var(--muted)}
.srow.done img{opacity:.5}
.scols{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}

/* Planner */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day.today{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft)}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.day-h b{font-size:14px;font-weight:800}
.day-h span{font-size:12px;color:var(--muted)}
.slot{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;background:var(--soft);border:1px dashed transparent;text-align:left;min-height:86px;width:100%}
.slot:hover{border-color:var(--sage)}
.slot small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.slot .slot-add{margin:auto;color:var(--green);font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px}
.slot .pick{display:flex;flex-direction:column;gap:6px}
.slot .pick img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;background:var(--green-soft)}
.slot .pick img.ill{object-fit:contain;padding:6px}
.slot .pick span{font-size:12px;font-weight:700;line-height:1.25}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:56vh;overflow:auto}
.plist button{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border:0;border-radius:12px;background:none;text-align:left}
.plist button:hover{background:var(--soft)}
.plist .thumb{width:56px;height:40px;border-radius:8px;overflow:hidden;flex:none}
.plist .thumb .rtile{aspect-ratio:auto;height:100%}
.plist .thumb img.ill{width:60%}

/* Premium */
.phero{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(100deg,var(--premium-2) 0%,var(--premium) 55%,#27473a 100%);color:#eef3ec;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);min-height:300px}
.phero-t{position:relative;z-index:1;padding:40px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.phero .eyebrow{color:var(--honey);display:flex;align-items:center;gap:8px}
.phero h1{font-size:clamp(28px,3.4vw,40px);line-height:1.1;font-weight:800;color:#fff;letter-spacing:-.03em}
.phero h1 span{display:block}
.phero p{color:#c9d6c8;max-width:46ch}
.phero-img{position:relative}
.phero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%);mask-image:linear-gradient(90deg,transparent 0,#000 30%)}
.phero .btn.ghost{color:#eef3ec}
.benefits{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.benefit{display:flex;gap:12px;align-items:flex-start}
.benefit .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.benefit b{display:block;font-size:14px}
.benefit span{font-size:13px;color:var(--muted)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;align-items:stretch}
.plan{padding:22px;display:flex;flex-direction:column;gap:12px;position:relative}
.plan.feat{border:2px solid var(--green)}
.plan h3{font-size:18px;font-weight:800}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.plan li{display:flex;gap:8px;align-items:flex-start}
.plan li svg{color:var(--green);margin-top:2px}
.plan .price{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:12px}
.plan .price b{font-size:26px;font-weight:800}
.plan .price small{color:var(--muted)}
.ribbon{position:absolute;top:-11px;right:18px;background:var(--green);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px}
.promo{position:relative;overflow:hidden;padding:22px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(160deg,#f3f6ee,#e7efe0)}
.promo h3{font-size:17px;font-weight:800;max-width:15ch}
.promo p{font-size:13px;color:var(--muted);max-width:22ch}
.promo img{position:absolute;right:-50px;bottom:-30px;width:210px;height:210px;object-fit:cover;border-radius:50%}
.tablewrap{overflow-x:auto}
table.cmp{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.cmp th,.cmp td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.cmp th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmp td:last-child{color:var(--green-dk);font-weight:700}
.cmp tr:last-child td{border-bottom:0}

/* Home extra */
.home2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.mini{padding:18px;display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;align-items:center;gap:10px;font-size:14px}
.mrow img,.mrow .tph{width:30px;height:30px}
.mrow .n{flex:1;min-width:0}
.meal{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;background:var(--soft);border:0;width:100%;text-align:left}
.meal .thumb{width:54px;height:40px;border-radius:8px;overflow:hidden;flex:none}
.meal .thumb .rtile{aspect-ratio:auto;height:100%}
.meal small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Admin */
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.panel{padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:17px;font-weight:800}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;max-height:180px;overflow:auto;padding:2px}
.gallery button{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:5px}
.gallery button img{width:100%;height:100%;object-fit:contain}
.gallery button[aria-pressed="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green);background:var(--green-soft)}
.alist{list-style:none;margin:0;padding:0;max-height:330px;overflow:auto}
.alist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.alist .thumb{width:52px;height:38px;border-radius:8px;overflow:hidden;flex:none}
.alist .thumb .rtile{aspect-ratio:auto;height:100%}
.alist .grow{flex:1;min-width:120px;overflow-wrap:anywhere}
.switch{display:flex;align-items:center;gap:10px;font-size:14px}
.switch input,.cats input{width:18px;height:18px;accent-color:var(--green)}
.cats{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px}
.cats label{display:flex;align-items:center;gap:6px}

.empty{padding:36px 20px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface)}
.empty img{width:56px;height:56px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:60;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;animation:rise .25s;max-width:calc(100vw - 32px)}
.bottomnav{display:none}

@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(12px);opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1280px){
  .rlayout{grid-template-columns:minmax(0,1fr)}
  .detail{display:none}
  .week{grid-template-columns:repeat(4,minmax(0,1fr))}
  .benefits{grid-template-columns:repeat(3,minmax(0,1fr))}
  .promo{grid-column:1/-1;min-height:160px}
}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
  .topbar .logo{display:flex}
  .topbar .search{order:3;flex-basis:100%;max-width:none}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgb(255 255 255 / .96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  .bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 2px;font-size:11px;font-weight:700;color:var(--muted);border-radius:12px;position:relative}
  .bottomnav button[aria-current="page"]{color:var(--green-dk);background:var(--green-soft)}
  .bottomnav svg.i{width:22px;height:22px}
  .bottomnav .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;font-size:10px;padding:0 4px}
  .actionbar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-txt{padding:28px 22px 24px}
  .hero-photo{height:200px;order:-1}
  .hero-photo img{-webkit-mask-image:linear-gradient(0deg,transparent 0,#000 35%);mask-image:linear-gradient(0deg,transparent 0,#000 35%)}
  .phero{grid-template-columns:minmax(0,1fr)}
  .phero-t{padding:28px 22px}
  .phero-img{height:180px;order:-1}
  .phero-img img{-webkit-mask-image:linear-gradient(0deg,transparent 0,#000 40%);mask-image:linear-gradient(0deg,transparent 0,#000 40%)}
  .home2,.cols2{grid-template-columns:minmax(0,1fr)}
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .stats{grid-template-columns:minmax(0,1fr)}
  .stat{padding:14px}
  .rgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .rbody{padding:10px 12px 12px}
  .rbody h3{font-size:14px}
  .compat{font-size:12px}
  .week{grid-template-columns:minmax(0,1fr)}
  .slot{flex-direction:row;align-items:center;min-height:0}
  .slot small{width:76px;flex:none}
  .slot .pick{flex-direction:row;align-items:center;flex:1}
  .slot .pick img{width:56px;flex:none}
  .slot .slot-add{margin:0}
  .benefits,.plans{grid-template-columns:minmax(0,1fr)}
  .cells{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheet-b{padding:20px}
  .sheet-top{grid-template-columns:minmax(0,1fr);padding:20px 20px 0}
  .sheet-top .rtile{aspect-ratio:16/10}
  .pagehead h1{font-size:26px}
  .pagehead .acts{margin-left:0}
  .hero-search{flex-wrap:wrap;padding:6px}
  .hero-search>svg{margin-left:8px}
  .hero-search .btn{flex-basis:100%}
}


/* ===== Adăugiri pentru versiunea completă: conturi, roluri, editor, administrare, statistici ===== */
:root{--c-used:#1baf7a;--c-waste:#eb6834}
[hidden]{display:none!important}
.stack{display:flex;flex-direction:column;gap:14px}
.rowacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nowrap{white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;align-items:center;gap:10px}
.row.prof{gap:14px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.tag.honey{background:var(--honey-soft);border-color:transparent;color:var(--honey-ink)}
.tag.red{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.avatar.ghost{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.avatar.ghost svg{width:18px;height:18px}
.avatar.big{width:56px;height:56px;font-size:18px}
select.bare{border:0;background:none;font-weight:600;font-size:13px}
.s28{width:28px;height:28px}
.field.sm{height:34px;font-size:13px;width:auto}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{filter:brightness(.93);border-color:var(--danger)}
.freebar.tone-g{background:var(--green-soft);color:var(--green-dk)}
.freebar.tone-g .link{color:var(--green-dk)}
.freebar.tone-r{background:var(--danger-soft);color:var(--danger)}
.freebar.tone-r .link{color:var(--danger)}
.hint{padding:16px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hint .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.err{color:var(--danger);font-size:13px;font-weight:600}
.err:empty{display:none}
.lbl small{font-weight:400}
.addthumb{display:grid;place-items:center;background:var(--surface);color:var(--green)}

/* Meniul contului */
.pop .menu{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;border:0;background:none;text-align:left;font-weight:600;font-size:14px}
.pop .menu:hover{background:var(--soft)}
.pop .link.mutedlink,.mutedlink{color:var(--muted);font-weight:600;font-size:13px}
.pop .row .s28{width:28px;height:28px}
.pop .btn{width:100%}

/* Bara demonstrativă */
.demobar{display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px 28px;background:var(--premium);color:#e8efe7;font-size:12px}
.dtag{background:var(--honey);color:#3b2a08;font-weight:800;border-radius:6px;padding:2px 7px;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.dtxt{white-space:nowrap}
.dchips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.dchip{height:26px;padding:0 11px;border-radius:999px;border:1px solid rgb(255 255 255 / .28);background:none;color:#e8efe7;font-size:12px;font-weight:600}
.dchip:hover{border-color:#fff}
.dchip[aria-pressed="true"]{background:#fff;color:var(--premium);border-color:#fff}
.dx{border:0;background:none;color:#e8efe7;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;flex:none}
.dx:hover{background:rgb(255 255 255 / .14)}

/* Pagini de acces și blocare */
.gate{max-width:560px;margin:24px auto;padding:36px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.gate .ic,.lockcard .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center}
.gate .ic svg,.lockcard .ic svg{width:30px;height:30px}
.gate h1,.lockcard h1{font-size:26px;font-weight:800}
.gate-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.lock{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.lockpage{display:contents}
.lockcard{max-width:480px;width:100%;padding:36px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.note{font-size:13px;color:var(--muted);padding:10px 12px;background:var(--soft);border-radius:12px}

/* Ferestre, alegeri, autentificare */
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);width:100%}
.choice:hover{border-color:var(--sage);background:var(--soft)}
.choice b{display:flex;align-items:center;gap:8px;font-size:15px}
.choice span{font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--soft);padding:4px;border-radius:12px;gap:4px;margin-right:36px}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:none;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.auth form{display:flex;flex-direction:column;gap:12px}
.pw{position:relative;display:block}
.pw .field{width:100%;padding-right:44px}
.eye{position:absolute;right:4px;top:50%;translate:0 -50%;width:36px;height:36px;border:0;background:none;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.eye:hover{background:var(--soft);color:var(--ink)}
.demoacc{padding:12px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;gap:8px}

/* Pagina principală: tonuri, bannere, blocuri */
.edentry{display:flex;justify-content:flex-end;margin-bottom:-18px}
.hero.tone-sage{background:linear-gradient(110deg,color-mix(in srgb,var(--green) 5%,#fff) 0%,var(--green-soft) 55%,color-mix(in srgb,var(--green) 20%,#fff) 100%)}
.hero.tone-cream{background:linear-gradient(110deg,#fffbf2,var(--honey-soft) 60%,color-mix(in srgb,var(--honey) 32%,#fff))}
.hero.tone-white{background:#fff}
.hero.tone-dark{background:linear-gradient(100deg,var(--premium-2),var(--premium) 60%,color-mix(in srgb,var(--premium) 86%,#fff));color:#eef3ec;border-color:transparent}
.hero.tone-dark h1{color:#fff}
.hero.tone-dark .lede{color:#c9d6c8}
.hero.tone-dark .eyebrow{color:var(--honey)}
.hero.tone-dark .hero-search{background:#fff;color:var(--ink)}
.banner{position:relative;overflow:hidden;border-radius:24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.7fr);min-height:220px;border:1px solid var(--line)}
.banner-t{position:relative;z-index:1;padding:32px 36px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;justify-content:center}
.banner h2{font-size:clamp(22px,2.6vw,30px);font-weight:800;letter-spacing:-.03em}
.banner p:not(.eyebrow){max-width:46ch;color:var(--muted)}
.banner-img{position:relative}
.banner-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%);mask-image:linear-gradient(90deg,transparent 0,#000 30%)}
.banner.tone-dark{background:linear-gradient(100deg,var(--premium-2),var(--premium) 60%,color-mix(in srgb,var(--premium) 86%,#fff));color:#eef3ec;border-color:transparent}
.banner.tone-dark h2{color:#fff}
.banner.tone-dark p:not(.eyebrow){color:#c9d6c8}
.banner.tone-dark .eyebrow{color:var(--honey)}
.banner.tone-sage{background:var(--green-soft)}
.banner.tone-cream{background:var(--honey-soft)}
.banner.tone-white{background:#fff}
.textblock{display:flex;flex-direction:column;gap:8px;max-width:70ch}
.textblock.center{margin-inline:auto;text-align:center;align-items:center}
.textblock h2{font-size:22px;font-weight:800}
.textblock p{color:var(--muted);font-size:16px}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.feat{display:flex;flex-direction:column;gap:6px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.feat .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin-bottom:6px}
.feat b{font-size:16px}
.feat>span:last-child{color:var(--muted);font-size:14px}

/* Editor vizual */
.eb{position:relative;border:2px dashed var(--sage);border-radius:26px;padding:8px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--green) 3%,transparent)}
.eb.off{opacity:.6;border-color:var(--line)}
.ebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 4px}
.etag{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--green-dk)}
.eacts{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.eacts button{height:30px;min-width:30px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:600}
.eacts button:hover:not(:disabled){border-color:var(--sage)}
.eacts button:disabled{opacity:.4;cursor:default}
.eacts .danger:hover{color:var(--danger);border-color:var(--danger)}
.ebody{pointer-events:none;user-select:none}
.addblock{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border:2px dashed var(--sage);border-radius:18px;background:none;color:var(--green-dk);font-weight:700}
.addblock:hover{background:var(--green-soft)}
.edbar{position:fixed;left:50%;translate:-50% 0;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--premium);color:#fff;border-radius:18px;padding:10px 12px 10px 16px;box-shadow:0 12px 34px rgb(22 42 31 / .35);max-width:calc(100vw - 24px);width:max-content}
.edtag{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.edhint{color:#c9d6c8}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.swatches input[type=color]{width:38px;height:30px;border:1px solid var(--line);border-radius:8px;padding:0;background:none}
.gallery.photos{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.gallery.photos button{aspect-ratio:3/2;padding:0;overflow:hidden}
.gallery.photos button img{object-fit:cover}
.gallery.big{max-height:240px;grid-template-columns:repeat(auto-fill,minmax(56px,1fr))}
.gallery.big button:not(.ic){aspect-ratio:3/2;padding:0;overflow:hidden;grid-column:span 2}
.gallery.big button:not(.ic) img{object-fit:cover}

/* Planuri Premium */
.plans{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}

/* Administrare */
.atabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;margin-top:-12px}
.atabs::-webkit-scrollbar{display:none}
.atabs button{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:none;font-weight:700;color:var(--muted);white-space:nowrap}
.atabs button:hover{color:var(--ink)}
.atabs button[aria-selected="true"]{color:var(--green-dk);border-bottom-color:var(--green)}
.panel.wide,.wide{grid-column:1/-1}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat small+small{display:block;margin-top:2px}
.meter{height:10px;border-radius:999px;background:var(--green-soft);overflow:hidden}
.meter.lg{height:14px}
.meter i{display:block;height:100%;border-radius:999px;background:var(--green)}
.alist.big{max-height:none}
.alist.big li{padding:10px 14px}
.alist.big .thumb{width:60px;height:44px}
.alist.audit li{align-items:flex-start}
.tablewrap .alist{padding:0}
.picbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:3px;min-width:40px;min-height:40px;justify-content:center;font-weight:600;font-size:13px}
.picbtn img{width:30px;height:30px}
.planrow{align-items:flex-end}
.plancol{min-width:160px;color:var(--muted)}
.users li.blocked{background:var(--danger-soft)}
.stats2{display:flex;gap:28px}
.stats2 b{font-size:30px;display:block;line-height:1.1}
.stats2 small{color:var(--muted)}
.txtgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
table.perm td,table.perm th{text-align:center}
table.perm td:first-child,table.perm th:first-child{text-align:left}
.yes{color:var(--green);position:relative;display:inline-flex}
.tablewrap{position:relative}
.perm .rs{display:none}
.no{color:var(--muted)}

/* Anti-risipă: statistici și grafice */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip.locked{color:var(--muted);background:var(--soft)}
.anrow{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:16px}
.herostat{padding:22px;display:flex;flex-direction:column;gap:8px}
.herostat .meter{background:color-mix(in srgb,var(--c-used) 18%,#fff);margin-top:4px}
.herostat .meter i{background:var(--c-used)}
.bigfig{font-size:56px;line-height:1;font-weight:800;letter-spacing:-.04em}
.kpi{padding:18px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.kpi small{color:var(--muted);font-size:13px}
.kpi b{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.kd{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.delta svg.i{width:15px;height:15px}
.delta.good{color:#006300}
.delta.bad{color:#b3261e}
.viz{position:relative}
.vizhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.legend{display:flex;gap:16px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw-u{background:var(--c-used)}
.sw-w{background:var(--c-waste)}
.chartbox{position:relative;width:100%}
.wksvg{display:block;overflow:visible;max-width:100%}
.wksvg .gl{stroke:#e6e7de;stroke-width:1}
.wksvg .ax{stroke:#cfd2c6;stroke-width:1}
.wksvg .yt,.wksvg .xt{fill:#7b857d;font-size:11px;font-family:var(--font)}
.wksvg .dl{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--font)}
.wksvg .su{fill:var(--c-used)}
.wksvg .sx{fill:var(--c-waste)}
.wksvg .hit{fill:transparent;outline:none}
.wksvg .hit:focus-visible{stroke:var(--ink);stroke-width:2}
.wksvg[data-hot] .col:not(.on) .su,.wksvg[data-hot] .col:not(.on) .sx{opacity:.45}
.vtip{position:absolute;z-index:5;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgb(41 54 45 / .16);padding:9px 12px;min-width:150px;font-size:13px}
.vtip .tt{font-weight:700;color:var(--muted);margin-bottom:4px}
.vtip .tr{display:flex;align-items:center;gap:8px;line-height:1.6}
.vtip .tr i{width:12px;height:3px;border-radius:2px;flex:none}
.vtip .k-u{background:var(--c-used)}
.vtip .k-w{background:var(--c-waste)}
.vtip .tr b{font-size:14px}
.vtip .tr span{color:var(--muted)}
.tview{margin-top:4px}
.tview summary{cursor:pointer;font-weight:700;color:var(--green-dk);font-size:14px}
.anrow2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.hbars{display:flex;flex-direction:column;gap:12px}
.hb{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:14px;border-radius:8px;padding:2px 0}
.hb:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ht{height:14px;display:block}
.ht i{display:block;height:100%;background:var(--c-waste);border-radius:0 4px 4px 0}
.hv{font-weight:700;min-width:70px;text-align:right}
.mini-t{width:100%;border-collapse:collapse;font-size:14px}
.mini-t th{font-size:12px;color:var(--muted);text-align:left;padding:6px 8px;text-transform:uppercase;letter-spacing:.06em}
.mini-t td{padding:8px;border-top:1px solid var(--line)}
.mini-t td:nth-child(n+2),.mini-t th:nth-child(n+2){text-align:right}
.tcell{display:inline-flex;align-items:center;gap:10px}
.lockedviz{position:relative;overflow:hidden;min-height:320px}
.fakeviz{filter:blur(5px);opacity:.55;pointer-events:none;user-select:none}
.lockover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;background:linear-gradient(0deg,rgb(255 255 255 / .78),rgb(255 255 255 / .45))}
.lockover .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
@media (forced-colors:active){.wksvg .su{fill:CanvasText}.wksvg .sx{fill:Canvas;stroke:CanvasText;stroke-width:2}.ht i{background:CanvasText}}

@media (max-width:1280px){
  .plans{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  .stats4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .anrow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .herostat{grid-column:1/-1}
  .anrow2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:980px){
  .demobar{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .banner{grid-template-columns:minmax(0,1fr)}
  .banner-img{height:160px;order:-1}
  .banner-img img{-webkit-mask-image:linear-gradient(0deg,transparent 0,#000 40%);mask-image:linear-gradient(0deg,transparent 0,#000 40%)}
  .banner-t{padding:24px 22px}
  .feats{grid-template-columns:minmax(0,1fr)}
  .edbar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .edhint{display:none}
  .edentry{margin-bottom:0}
}
@media (max-width:640px){
  .plans{grid-template-columns:minmax(0,1fr)}
  .stats4{grid-template-columns:minmax(0,1fr)}
  .anrow{grid-template-columns:minmax(0,1fr)}
  .bigfig{font-size:48px}
  .hb{grid-template-columns:78px minmax(0,1fr) auto}
  .alist li{align-items:flex-start}
  .planrow .lbl{flex:1 1 120px}
  .gate{padding:28px 20px}
  .eacts{margin-left:0;width:100%}
  .dtxt{display:none}
  .toolbar .search{flex:1 1 100%;max-width:none!important}
  table.cmp{min-width:0;font-size:13px}
  .cmp th,.cmp td{padding:10px 8px}
  .cmp th{font-size:10px;letter-spacing:.02em}
  table.cmp.perm th:first-child,table.cmp.perm td:first-child{padding-left:2px}
  .perm .rl{display:none}
  .perm .rs{display:inline}
}

/* ---------- v3: mese flexibile, familie, antrenor ---------- */
.alist.flat{max-height:none}
.slotw{position:relative}
.slotw .slot{width:100%}
.slotw.extra .slot{background:color-mix(in srgb,var(--honey) 9%,var(--surface))}
.slotx{position:absolute;top:6px;right:6px;width:26px;height:26px;border:0;border-radius:8px;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.slotx:hover{background:var(--soft);color:var(--danger)}
.slotx svg{width:15px;height:15px}
.addmeal{display:flex;gap:12px;flex-wrap:wrap;padding-top:2px}
.addmeal .link{font-size:13px;display:inline-flex;align-items:center;gap:4px}
.addmeal .link svg{width:14px;height:14px}
.pick.txt span{font-weight:600;white-space:normal}
.fambar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:var(--green-soft);color:var(--green-dk);font-size:14px}
.fambar.muted{background:var(--soft);color:var(--ink)}
.fambar span{flex:1;min-width:200px}
.fambar svg{width:18px;height:18px;flex:none}
.alist li.pending{opacity:.85}
.avatar.ghost{background:var(--soft);color:var(--muted)}
.ctabs{margin-top:0;margin-bottom:4px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.back svg,.flip svg{transform:scaleX(-1)}
.flip{display:inline-grid}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.mcard{padding:18px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.mcard h3{font-size:17px;margin:2px 0 4px}
.menuhead{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
.menuhead h2{font-size:24px;margin:2px 0 6px}
.menuhead .grow{flex:1;min-width:240px}
.mweek{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
/* tonuri pentru studenți (fundal deschis + bordură colorată; textul rămâne închis) */
.t1{--tc:#477653}.t2{--tc:#c98a1b}.t3{--tc:#3f6fb5}.t4{--tc:#b04a6a}.t5{--tc:#6b5bb5}.t6{--tc:#1f8a8a}
.avatar.t1,.avatar.t2,.avatar.t3,.avatar.t4,.avatar.t5,.avatar.t6{background:var(--tc);color:#fff}
.calcard{padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.calbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.calnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.calnav h3{font-size:18px;margin-left:6px;text-transform:none}
.calright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calseg{margin:0;min-width:250px}
.calsum{font-size:14px;color:var(--muted)}
.calsum b{color:var(--ink)}
.calscroll{overflow-x:auto;min-width:0;border:1px solid var(--line);border-radius:14px}
.tgrid{display:grid;grid-template-columns:54px repeat(var(--cols),minmax(84px,1fr));min-width:calc(54px + var(--cols)*84px)}
.tgrid.one{grid-template-columns:54px 1fr;min-width:0}
.tg-corner{border-bottom:1px solid var(--line)}
.tg-day{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 0;border:0;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);cursor:pointer}
.tg-day small{color:var(--muted);font-weight:700;font-size:12px}
.tg-day b{font-size:18px}
.tg-day.today b{background:var(--green);color:#fff;border-radius:999px;width:32px;height:32px;display:grid;place-items:center}
.tg-hours{display:flex;flex-direction:column}
.tg-hours span{font-size:11px;color:var(--muted);text-align:right;padding:2px 8px 0 0;box-sizing:border-box}
.tg-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--h) - 1px),var(--line) calc(var(--h) - 1px),var(--line) var(--h))}
.tg-col.today{background-color:color-mix(in srgb,var(--green) 5%,transparent)}
.ev{position:absolute;left:3px;right:3px;border:0;border-left:4px solid var(--tc);border-radius:8px;background:color-mix(in srgb,var(--tc) 15%,var(--surface));color:var(--ink);text-align:left;padding:3px 6px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.ev b{font-size:12px}
.ev span{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev:hover,.ev:focus-visible{filter:brightness(.97);outline:2px solid var(--tc);outline-offset:1px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mg-h{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mg-d{min-height:96px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);padding:6px;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;cursor:pointer;min-width:0}
.mg-d:nth-child(7n+7){border-right:0}
.mg-d.out{background:var(--soft);color:var(--muted)}
.mg-d.today .mg-n{background:var(--green);color:#fff;border-radius:999px;width:24px;height:24px;display:grid;place-items:center}
.mg-n{font-size:13px;font-weight:700}
.mg-ev{font-size:11px;border-left:3px solid var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--surface));border-radius:5px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.mg-more{font-size:11px;color:var(--muted);font-weight:700}
@media (max-width:640px){
  .calseg{min-width:0;flex:1}
  .calright{width:100%}
  .mg-d{min-height:64px;padding:3px}
  .mg-ev{font-size:0;height:6px;padding:0;border-left:0;background:var(--tc)}
  .menuhead .rowacts{width:100%}
}
@media (forced-colors:active){.ev,.mg-ev{border:1px solid CanvasText}}
.ev.short{flex-direction:row;align-items:center;gap:5px}
.ev{gap:1px}
.mysec{border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-top:10px}
.mysec summary{display:flex;align-items:center;gap:8px;padding:12px 0;cursor:pointer;list-style:none}
.mysec summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.mysec[open] summary::after{transform:rotate(-135deg)}
.mysec summary::-webkit-details-marker{display:none}
.mysec .tablewrap{margin-bottom:12px}
table.cmp.mytbl{min-width:0;font-size:13px}
.mytbl th,.mytbl td{padding:8px 10px}
.mytbl td:last-child{color:inherit;font-weight:400}
.mylist{margin:0 0 12px;padding-left:18px;font-size:14px}

/* ---------- Înlocuire imagine dintr-un click ---------- */
.imgw{position:relative;display:inline-block}
.imgrep{position:absolute;top:12px;right:12px;z-index:3;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(22,32,24,.78);color:#fff;font-size:13px;font-weight:700;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.imgrep:hover{background:rgba(22,32,24,.92)}
.imgrep:focus-within{outline:3px solid var(--honey);outline-offset:2px}
.imgrep .i{width:16px;height:16px}
.imgrep.busy{opacity:.85;cursor:progress}
.imgrep.sm{top:auto;bottom:3px;right:3px;padding:5px;gap:0}
.imgrep.sm span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.imgrep.sm .i{width:14px;height:14px}

/* ---------- Pagina principală pe zone: Sus / Lateral / Jos ---------- */
.hzone{display:flex;flex-direction:column;gap:32px;min-width:0}
.homegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,320px);gap:28px;align-items:start}
.zside .banner{grid-template-columns:minmax(0,1fr);min-height:0}
.zside .banner-img{height:170px;order:-1}
.zside .banner-img img{-webkit-mask-image:linear-gradient(0deg,transparent 0,#000 40%);mask-image:linear-gradient(0deg,transparent 0,#000 40%)}
.zside .banner-t{padding:20px 22px 24px}
.zside .banner h2{font-size:21px}
@media (max-width:1000px){.homegrid{grid-template-columns:minmax(0,1fr)}}

/* ---------- Panoul banerelor (drag & drop) ---------- */
.bangrid{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.banmid{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,300px);gap:12px}
@media (max-width:760px){.banmid{grid-template-columns:minmax(0,1fr)}}
.banzone,.banmain{border:2px dashed var(--line);border-radius:16px;padding:12px;background:var(--bg);min-width:0}
.banzone.z-top{border-color:color-mix(in srgb,var(--green) 45%,var(--line))}
.banzone.z-side{border-color:color-mix(in srgb,var(--honey) 60%,var(--line))}
.banzone.z-bottom{border-color:color-mix(in srgb,var(--green) 25%,var(--line))}
.banmain{border-style:solid;background:var(--card,#fff);opacity:.85}
.banzone-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:8px}
.banlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-height:56px}
.banempty{margin:-48px 0 0;height:48px;display:grid;place-items:center;pointer-events:none}
.banstatic{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.banstatic li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--bg)}
.banstatic .i{width:16px;height:16px}
.bancard{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#fff;border:1px solid var(--line);cursor:grab;touch-action:pan-y;flex-wrap:wrap}
.bancard:active{cursor:grabbing}
.bancard.off{opacity:.6}
.bancard .grow{flex:1;min-width:120px}
.banhandle{color:var(--muted);display:grid;place-items:center}
.banhandle .i{width:18px;height:18px}
.banthumb{width:64px;height:44px;border-radius:8px;overflow:hidden;flex:none;background:var(--bg)}
.banthumb img{width:100%;height:100%;object-fit:cover;display:block}
.banmove{display:flex;align-items:center;gap:4px}
.banmove .field.sm{padding:4px 8px;min-height:32px;width:auto}
.bancard.ghost{opacity:.35;border-style:dashed}
.bancard.chosen{box-shadow:0 8px 24px rgba(0,0,0,.14)}

/* ---------- Stoc vs. rețetă ---------- */
.ilist .n small.lack{color:var(--danger)}
.missbox{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 25%,transparent)}
.missbox p{margin:0}

/* ---------- Import cu AI ---------- */
.aisheet code{font-size:13px;background:var(--soft);padding:1px 5px;border-radius:6px}
.aiform textarea{min-height:170px;resize:vertical;font-size:15px;line-height:1.5}
.aibar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.aibar .btn{margin-left:auto}
.aisteps{list-style:none;margin:6px 0;padding:16px 18px;display:flex;flex-direction:column;gap:12px;border-radius:16px;background:var(--green-soft)}
.aisteps li{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:600}
.aisteps li.now{color:var(--ink)}
.aisteps li.done{color:var(--green-dk)}
.aidot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--line);flex:none}
.aisteps li.done .aidot{background:var(--green);border-color:var(--green);color:#fff}
.aisteps li.done .aidot .i{width:14px;height:14px}
.aisteps li.now .aidot{border-color:var(--green)}
.aispin{width:12px;height:12px;border-radius:50%;border:2px solid var(--green);border-right-color:transparent;animation:aispin .8s linear infinite}
@keyframes aispin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.aispin{animation-duration:2.4s}}
.aierr{display:flex;gap:10px;align-items:flex-start;background:var(--danger-soft);color:var(--danger);border-color:transparent}
.aierr .i{flex:none;margin-top:2px}
.aicard{display:flex;flex-direction:column;gap:20px;padding:20px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(180deg,var(--green-soft),#fff 180px);margin-top:4px}
.aihead{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:20px;align-items:start}
.aimedia .rtile{border-radius:16px;overflow:hidden;aspect-ratio:4/3}
.aiinfo{display:flex;flex-direction:column;gap:10px;min-width:0}
.aiinfo h3{font-size:clamp(22px,3vw,28px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0}
.aiinfo p{margin:0}
.aiinfo a{color:var(--green-dk);font-weight:600;word-break:break-word}
.aicols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px}
.aicols .h3{margin-bottom:6px;display:flex;align-items:center;gap:8px}
.ilist .n small.ainote{color:var(--muted)}
.ainut .cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ainut .cells div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;display:flex;flex-direction:column}
.ainut .cells b{font-size:18px}
.ainut .cells span{font-size:12px;color:var(--muted)}
.ainut p{margin:6px 0 0}
.aiwarn ul{margin:4px 0 0;padding-left:18px}
.aihist{margin-top:8px}
@media (max-width:720px){.aihead,.aicols{grid-template-columns:minmax(0,1fr)}.aimedia{max-width:260px}.ainut .cells{grid-template-columns:repeat(2,minmax(0,1fr))}}

const UCONV={g:["g",1],kg:["g",1000],ml:["ml",1],l:["ml",1000],"lingură":["lingură",1],linguri:["lingură",1]};

const TOKEN_KEY="gusto_token",VIS_KEY="gusto_visitor";
const getTok=()=>{try{return localStorage.getItem(TOKEN_KEY)||""}catch(e){return""}};
const setTok=t=>{try{t?localStorage.setItem(TOKEN_KEY,t):localStorage.removeItem(TOKEN_KEY)}catch(e){}};
let _vis="";
function visitorId(){if(_vis)return _vis;
 try{_vis=localStorage.getItem(VIS_KEY)||""}catch(e){}
 if(!_vis){_vis="v"+[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,"0")).join("");try{localStorage.setItem(VIS_KEY,_vis)}catch(e){}}
 return _vis}
async function api(path,o={}){
 const headers={"X-Visitor":visitorId()},t=getTok();
 if(t)headers.Authorization="Bearer "+t;
 if(o.body!==undefined)headers["Content-Type"]="application/json";
 const ac=new AbortController(),to=setTimeout(()=>ac.abort(),25000);
 try{const r=await fetch(API_URL+"/api"+path,{method:o.method||"GET",headers,body:o.body!==undefined?JSON.stringify(o.body):undefined,signal:ac.signal});
  let data=null;try{data=await r.json()}catch(e){}
  return{status:r.status,ok:r.ok,data}}
 catch(e){return{status:0,ok:false,data:{error:"Nu mă pot conecta la server. Verifică internetul și încearcă din nou."}}}
 finally{clearTimeout(to)}}

/* ---------- Sincronizarea datelor personale (frigider, liste, favorite, planificator, anti-risipă) ---------- */
const SYNC={timer:null,busy:false,dirty:false,pulling:false,ready:false,sig:"",fails:0};
const syncOn=()=>SRV&&!!getTok()&&!!ME();
const syncSig=()=>JSON.stringify([S.fridge,S.shop,S.fav,S.plan,S.pdays,S.log.filter(e=>!e.s&&!e.demo).length]);
function srvDirty(){if(!syncOn()||SYNC.pulling||!SYNC.ready)return;
 if(syncSig()===SYNC.sig)return;                 // s-a schimbat doar aspectul/pagina, nu datele
 SYNC.dirty=true;if(!S.pend){S.pend=1;persist()}clearTimeout(SYNC.timer);SYNC.timer=setTimeout(srvPush,1200)}
function applySnap(d){
 S.fridge=d.fridge||[];S.shop=d.shop||[];S.fav=d.fav||[];S.plan=d.plan||{};S.pdays=d.pdays||{};
 S.log=[...(d.log||[]),...S.log.filter(e=>!e.s&&!e.demo)];S.rev=d.rev||0;
 SYNC.sig=syncSig()}
async function srvPush(){
 if(!syncOn()||SYNC.busy||!SYNC.dirty)return;
 SYNC.busy=true;SYNC.dirty=false;
 const sent=S.log.filter(e=>!e.s&&!e.demo).slice(-500);
 const body={rev:S.rev||0,fridge:S.fridge,shop:S.shop,fav:S.fav,plan:S.plan,pdays:S.pdays,logAdd:sent};
 const r=await api("/me/data",{method:"PUT",body});
 SYNC.busy=false;
 if(r.ok){SYNC.fails=0;S.rev=r.data.rev;sent.forEach(e=>e.s=1);SYNC.sig=syncSig();if(!SYNC.dirty)S.pend=0;persist();if(SYNC.dirty)srvDirty();return}
 if(r.status===409){applySnap(r.data.data);S.pend=0;persist();draw();toast("Datele au fost actualizate de pe alt dispozitiv.");return}
 if(r.status===401){setTok("");toast("Sesiunea a expirat. Autentifică-te din nou.");return}
 SYNC.dirty=true;SYNC.fails++;
 if(SYNC.fails===1)toast(r.status===0?"Nu am putut salva pe server. Mai încerc.":"Nu am putut salva datele pe server. Mai încerc.");
 clearTimeout(SYNC.timer);SYNC.timer=setTimeout(srvPush,Math.min(60000,5000*SYNC.fails))}
// aduce datele de pe server; întoarce true dacă s-a schimbat ceva
async function srvPull(force){
 if(!syncOn()||SYNC.busy||SYNC.dirty)return false;

function socOp(method,path,body,opt){
 opt=opt||{};SOC.n++;
 SOC.q=SOC.q.then(async()=>{
  if(opt.flush)await srvFlush();

/* ---------- optimizare: imaginea se micșorează în browser înainte de încărcare ---------- */
function optimizeImg(file,max,cb){
 if(!file)return;if(!/^image\//.test(file.type)){toast("Alege un fișier imagine (JPEG, PNG sau WebP).");return}
 const fr=new FileReader();
 fr.onload=()=>{const im=new Image();
  im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
   c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
   const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
   // WebP dacă browserul îl poate produce (fișier mai mic), altfel JPEG; calitatea scade până încape sub ~1 MB
   const webp=c.toDataURL("image/webp",.82).startsWith("data:image/webp"),type=webp?"image/webp":"image/jpeg";
   let q=.82,u=c.toDataURL(type,q);while(u.length>1.3e6&&q>.45){q-=.12;u=c.toDataURL(type,q)}
   cb(u)};
  im.onerror=()=>toast("Imaginea nu a putut fi citită.");im.src=fr.result};
 fr.readAsDataURL(file)}

     if(!up.ok)return toast((up.data&&up.data.error)||"Imaginea nu a putut fi încărcată.");

     if(x.status===409&&can("frontend")){   // pagina nu e încă pe server: o publicăm întâi, apoi înlocuim

      x=await api("/home",{method:"PUT",body:{blocks,theme:S.theme}})}
     if(!x.ok)return toast((x.data&&x.data.error)||"Imaginea nu a putut fi salvată.");
     homeSet(x.data.home)}
    else{b.img=u;audit("A înlocuit o imagine de pe pagina principală");save()}
    toast("Imaginea a fost înlocuită")}
  }finally{IMGREP.busy=null;draw()}})}

function homeSet(h){if(h&&Array.isArray(h.blocks)&&h.blocks.length){S.home=h.blocks;persist()}}
async function homeLoad(){if(!SRV)return false;
 const r=await api("/home");if(!r.ok)return false;
 const before=JSON.stringify([S.home,S.theme]);
 if(Array.isArray(r.data.blocks)&&r.data.blocks.length)S.home=r.data.blocks;
 if(r.data.theme&&r.data.theme.color){S.theme={...DEF_THEME,...r.data.theme};applyTheme(S.theme)}
 if(before===JSON.stringify([S.home,S.theme]))return false;persist();return true}
async function homePush(extra){
 const r=await api("/home",{method:"PUT",body:{blocks:S.home,theme:S.theme,texts:S.txt,...(extra||{})}});
 if(!r.ok){toast((r.data&&r.data.error)||"Nu am putut salva pe server.");await homeLoad();draw();return false}
 homeSet(r.data.home);return true}

function banMount(){

function banApply(order){   // ordinea finală: blocurile de conținut, apoi banerele Sus, Lateral, Jos
 const byId2=Object.fromEntries(S.home.map(b=>[b.id,b]));
 const bs=order.map(([id,z])=>{const b=byId2[id];b.zone=z;return b}).filter(Boolean);
 const rest=S.home.filter(b=>b.type!=="banner");
 const zo={top:0,side:1,bottom:2};

async function banSave(){

function banZone(id,z){const o=banners().map(b=>[b.id,b.id===id?z:zoneOf(b)]);const i=o.findIndex(x=>x[0]===id);const [it]=o.splice(i,1);o.push(it);banApply(o);banSave()}
function banStep(id,d){const o=banners().map(b=>[b.id,zoneOf(b)]),zs=["top","side","bottom"];const i=o.findIndex(x=>x[0]===id);if(i<0)return;
 const z=o[i][1],same=o.map((x,k)=>[x,k]).filter(([x])=>x[1]===z),pos=same.findIndex(([,k])=>k===i);
 if(same[pos+d]){const j=same[pos+d][1];[o[i],o[j]]=[o[j],o[i]]}
 else{const nz=zs[zs.indexOf(z)+d];if(!nz)return;o[i][1]=nz;const [it]=o.splice(i,1);if(d<0)o.push(it);else o.unshift(it)}
 banApply(o);banSave()}

function filtered(){const A=avail(),q=Q.trim().toLowerCase();

  if(S.sel.length&&!r.i.some(x=>S.sel.includes(x[0])))return false;return true});

 l.sort(S.sort==="time"?(a,b)=>a.t-b.t:S.sort==="dif"?(a,b)=>D[a.dif]-D[b.dif]||a.t-b.t:(a,b)=>compat(b,A)/b.i.length-compat(a,A)/a.i.length||compat(b,A)-compat(a,A)||a.t-b.t);
