<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gusto: rețete după ingredientele pe care le ai, frigider virtual, listă de cumpărături și planificator de mese.">
<link rel="icon" href="img/cooking.png">
<title>Gusto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: bară laterală fixă + conținut pe fundal ivory, carduri albe rotunjite. Pe telefon bara laterală devine meniu jos.
   Direcție: Fresh & Organic + Smart Kitchen, zonă Premium verde închis cu accente miere. Doar varianta luminoasă. */
:root{
  --bg:#f7f6f0; --surface:#ffffff; --soft:#f2f3ec; --line:#e6e7de; --ink:#29362d; --muted:#6c776f;
  --green:#477653; --green-dk:#355c40; --green-soft:#e7efe5; --sage:#a7be9a;
  --honey:#e7b96b; --honey-soft:#fbf2df; --honey-ink:#7a5310;
  --danger:#c2452d; --danger-soft:#fbe9e4; --warn:#c98a1b; --warn-soft:#fdf3e1;
  --premium:#1f3a2b; --premium-2:#162a1f;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --shadow:0 1px 2px rgb(41 54 45 / .04),0 4px 16px rgb(41 54 45 / .05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--green)}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;border-right:1px solid var(--line);background:var(--bg)}
.logo{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;letter-spacing:-.03em;padding:0 10px 18px;background:none;border:0;color:var(--ink)}
.logo svg{width:28px;height:28px;color:var(--green);fill:var(--green-soft)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;color:var(--muted);font-weight:600;text-align:left}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--green-soft);color:var(--green-dk)}
.nav .badge{margin-left:auto}
.side .me{margin-top:auto}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:0;background:none;text-align:left;width:100%}
.me:hover{background:var(--soft)}
.me b{display:block;font-size:14px}
.me span{font-size:12px;color:var(--muted)}
.me .avatar{color:#fff;font-size:13px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--line);color:var(--ink);font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.badge.red{background:var(--danger);color:#fff}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:center;gap:12px;padding-block:14px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
.topbar .logo{display:none;padding:0}
.search{position:relative;flex:1;max-width:460px}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--muted)}
.search input{width:100%;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 16px 0 42px}
.search input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;position:relative}
.iconbtn{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--soft)}
.iconbtn .badge{position:absolute;top:2px;right:0;min-width:17px;height:17px;font-size:10px;padding:0 4px}
.content{padding-block:8px 64px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:32px}
.pagehead{display:flex;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.pagehead h1{font-size:30px;font-weight:800;letter-spacing:-.03em}
.pagehead p{color:var(--muted);margin-top:4px}
.pagehead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* Popovers */
.pop{position:absolute;top:48px;right:0;z-index:20;width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgb(41 54 45 / .16);padding:14px;display:flex;flex-direction:column;gap:10px}
.pop h4{font-size:14px}
.pop .row{display:flex;align-items:center;gap:10px;font-size:14px}
.pop hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}

/* Controls */
.btn{height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--sage)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-dk)}
.btn.honey{background:var(--honey);border-color:var(--honey);color:#3b2a08}
.btn.ghost{background:none;border-color:transparent;color:var(--green)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
.field{height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;min-width:0}
textarea.field{height:auto;padding:10px 12px;resize:vertical}
.field:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip:hover{border-color:var(--sage)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.chip img{width:18px;height:18px}
.chip.x{background:var(--green-soft);border-color:transparent;color:var(--green-dk)}
.link{background:none;border:0;padding:0;color:var(--green);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sechead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sechead h2{font-size:20px;font-weight:800}
.sechead .link{margin-left:auto}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(110deg,#f3f5ec 0%,#eaf0e2 55%,#e3ebd9 100%);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);min-height:330px}
.hero-txt{position:relative;z-index:1;padding:40px 0 36px 40px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(30px,3.6vw,44px);line-height:1.08;font-weight:800;letter-spacing:-.035em}
.hero h1 span{display:block}
.hero p.lede{color:var(--muted);max-width:44ch;font-size:16px}
.hero-search{display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;max-width:520px;box-shadow:var(--shadow)}
.hero-search input{flex:1;min-width:0;border:0;background:none;height:40px;outline:none}
.hero-photo{position:relative}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%);mask-image:linear-gradient(90deg,transparent 0,#000 22%)}

/* Recipe cards */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.rgrid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.rgrid.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rcard{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s}
.rcard:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgb(41 54 45 / .1)}
.rcard[aria-current="true"]{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft)}
.rtile{position:relative;aspect-ratio:3/2;max-width:100%;background:radial-gradient(circle at 50% 60%,#fff 0,var(--green-soft) 75%);display:grid;place-items:center;overflow:hidden}
.rtile img.photo{width:100%;height:100%;object-fit:cover}
.rtile img.ill{width:44%;filter:drop-shadow(0 12px 14px rgb(41 54 45 / .18));transition:transform .4s}
.rcard:hover .rtile img.ill{transform:scale(1.06) rotate(-3deg)}
.rtile .ph{font-size:44px;font-weight:800;color:var(--sage)}
.heart{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgb(255 255 255 / .92);display:grid;place-items:center;color:var(--danger);box-shadow:0 2px 8px rgb(0 0 0 / .1)}
.heart svg{width:17px;height:17px}
.heart[aria-pressed="true"] svg{fill:currentColor}
.rbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.rbody h3{font-size:15px;font-weight:700;line-height:1.3}
.meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.meta svg.i{width:15px;height:15px}
.compat{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--green)}
.compat svg.i{width:16px;height:16px}
.compat.low{color:var(--muted)}

/* Recipes page */
.rlayout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.detail{position:sticky;top:84px;overflow:hidden;padding:0}
.detail .rtile{aspect-ratio:16/10}
.detail-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.detail-b h2{font-size:20px;font-weight:800}
.ilist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ilist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ilist li:last-child{border-bottom:0}
.ilist img,.ilist .tph{width:28px;height:28px;flex:none}
.ilist .n{flex:1;min-width:0}
.ilist .n small{display:block;color:var(--honey-ink);font-size:12px}
.ilist .q{color:var(--muted);white-space:nowrap}
.st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none}
.st svg{width:13px;height:13px;stroke-width:3}
.st.ok{background:var(--green);color:#fff}
.st.sub{background:var(--honey);color:#3b2a08}
.st.no{background:var(--danger-soft);color:var(--danger)}
.tph{display:inline-grid;place-items:center;border-radius:50%;background:var(--green-soft);color:var(--green);font-weight:700;font-size:12px}
.freebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--honey-soft);color:var(--honey-ink);font-size:14px;font-weight:600}
.freebar .link{color:var(--honey-ink);margin-left:auto}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .chips{flex:1;min-width:0}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Modal */
.scrim{position:fixed;inset:0;z-index:40;background:rgb(22 30 24 / .5);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .18s}
.sheet{position:relative;width:100%;max-width:880px;max-height:100%;overflow:auto;background:var(--surface);border-radius:24px;animation:rise .25s cubic-bezier(.2,.8,.2,1)}
.sheet.sm{max-width:520px}
.sheet .x{position:absolute;top:12px;right:12px;z-index:3;background:rgb(255 255 255 / .92)}
.sheet-top{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;padding:24px 28px 0;align-items:center}
.sheet-top .media{position:relative;border-radius:18px;overflow:hidden}
.sheet-top .rtile{aspect-ratio:4/3}
.sheet-top .heart{right:auto;left:10px}
.sheet-top h2{font-size:28px;font-weight:800;letter-spacing:-.03em}
.sheet-b{padding:24px 28px 28px;display:flex;flex-direction:column;gap:20px}
.sheet-b h2{font-size:28px;font-weight:800;letter-spacing:-.03em}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.facts{display:flex;gap:10px;flex-wrap:wrap}
.fact{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--soft);font-size:14px;font-weight:600}
.nut{position:relative}
.cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cells div{background:var(--soft);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column}
.cells b{font-size:18px;font-variant-numeric:tabular-nums}
.cells span{font-size:12px;color:var(--muted)}
.nut.locked .cells{filter:blur(7px);user-select:none}
.lockmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.lockmsg .btn{box-shadow:0 6px 20px rgb(0 0 0 / .12)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:12px}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--green-soft);color:var(--green-dk);font-weight:800;font-size:13px;display:grid;place-items:center}
.h3{font-size:16px;font-weight:800}
.box{padding:14px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;gap:10px}
.box.honey{background:var(--honey-soft)}
.paywall{padding:22px;border-radius:18px;background:var(--premium);color:#eef3ec;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.paywall h3{font-size:20px;color:#fff}

/* Fridge */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stat{display:flex;align-items:center;gap:14px;padding:18px}
.stat .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.stat .ic svg{width:22px;height:22px}
.stat small{display:block;color:var(--muted);font-size:13px}
.stat b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.ic.g{background:var(--green-soft);color:var(--green)}
.ic.r{background:var(--danger-soft);color:var(--danger)}
.ic.h{background:var(--honey-soft);color:var(--honey-ink)}
.fcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;align-items:start}
.fcol{padding:14px 16px 6px}
.fcol-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;padding-bottom:6px}
.fcol-h .badge{margin-left:auto}
.frow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.frow .chk{width:20px;height:20px;accent-color:var(--green);flex:none}
.frow img,.frow .tph{width:36px;height:36px;flex:none}
.frow .n{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.frow .n b{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .n>span{font-size:12px;color:var(--muted)}
.exp{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.exp::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.exp.d{color:var(--danger)} .exp.w{color:var(--warn)} .exp.o{color:var(--green)}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.qty button:hover{color:var(--ink);border-color:var(--sage)}
.qty svg.i{width:14px;height:14px}
.frow .del{width:28px;height:28px;border:0;background:none;color:var(--muted);border-radius:8px;display:grid;place-items:center}
.frow .del:hover{background:var(--danger-soft);color:var(--danger)}
.addpanel{padding:18px;display:flex;flex-direction:column;gap:12px}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.form .grow{flex:1;min-width:180px}
.lbl{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
.lbl .field{font-weight:400}
.w90{width:90px}.w120{width:130px}
.suggest{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-radius:16px;background:var(--warn-soft);border:1px solid #f3e0bb}
.suggest b{font-weight:800}
.actionbar{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;background:var(--premium);color:#fff;border-radius:16px;padding:10px 10px 10px 20px;box-shadow:0 12px 30px rgb(22 42 31 / .3);font-weight:700}

/* Shopping */
.slist{padding:6px 16px}
.srow{display:flex;align-items:center;gap:12px;min-height:56px;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow input[type="checkbox"]{appearance:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--sage);display:grid;place-items:center;flex:none;margin:0;cursor:pointer}
.srow input[type="checkbox"]:checked{background:var(--green);border-color:var(--green)}
.srow input[type="checkbox"]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;rotate:45deg;translate:0 -1px}
.srow img,.srow .tph{width:34px;height:34px;flex:none}
.srow label{flex:1;min-width:0;display:flex;flex-direction:column;cursor:pointer;line-height:1.3}
.srow label b{font-weight:700}
.srow label span{font-size:12px;color:var(--muted)}
.srow.done label b{text-decoration:line-through;color:var(--muted)}
.srow.done img{opacity:.5}
.scols{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}

/* Planner */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day.today{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft)}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.day-h b{font-size:14px;font-weight:800}
.day-h span{font-size:12px;color:var(--muted)}
.slot{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;background:var(--soft);border:1px dashed transparent;text-align:left;min-height:86px;width:100%}
.slot:hover{border-color:var(--sage)}
.slot small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.slot .slot-add{margin:auto;color:var(--green);font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px}
.slot .pick{display:flex;flex-direction:column;gap:6px}
.slot .pick img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;background:var(--green-soft)}
.slot .pick img.ill{object-fit:contain;padding:6px}
.slot .pick span{font-size:12px;font-weight:700;line-height:1.25}

 </section>`}
function heroGo(e){e.preventDefault();const v=$("hq").value.trim().toLowerCase();if(v&&!S.sel.includes(v))S.sel.push(v);S.page="retete";save();draw();scrollTo({top:0})}

/* ---------- Rețete ---------- */
const RCATS=["Toate","Favorite","Mic dejun","Prânz","Cină","Desert","Vegetarian","Rapid"];
function vRecipes(){
 const opened=Math.min(S.viewed.length,S.limit);
 return `<div class="pagehead"><div><h1>Rețete</h1><p>Descoperă rețete delicioase, adaptate ingredientelor tale.</p></div></div>
 ${prem()?"":`<div class="freebar">${I("lock")}Plan gratuit: ai deschis ${opened} din ${S.limit} rețete. Valorile nutriționale sunt disponibile în Premium.<button class="link" onclick="go('premium')">Vezi Premium ${I("arrow")}</button></div>`}
 <div class="rlayout"><div style="display:flex;flex-direction:column;gap:16px;min-width:0">
  <div class="toolbar"><div class="chips">${RCATS.map(c=>`<button class="chip" aria-pressed="${S.rcat==c}" onclick="S.rcat='${c}';save();draw()">${c}</button>`).join("")}</div>
   <label class="chip" style="padding-right:6px">${I("filter")}<select aria-label="Sortează" style="border:0;background:none;font-weight:600;font-size:13px" onchange="S.sort=this.value;save();renderRecipes()">${[["compat","Compatibilitate"],["time","Timp de preparare"],["dif","Dificultate"]].map(([v,l])=>`<option value="${v}" ${S.sort==v?"selected":""}>${l}</option>`).join("")}</select></label></div>
  <div class="selbar"><span class="small muted">Ingredientele tale:</span>${S.sel.length?S.sel.map(n=>`<button class="chip x" onclick="togSel(${jsq(n)})" aria-label="Elimină ${esc(n)}">${thumb(n)}${esc(n)} ${I("x")}</button>`).join("")+`<button class="link" onclick="S.sel=[];save();draw()">Șterge</button>`:`<span class="small">tot ce ai în frigider (${S.fridge.length} produse)</span>`}
   <form onsubmit="addSel(event)" style="display:flex;gap:6px"><input id="selq" class="field" style="height:34px;width:170px" list="dlp2" placeholder="+ ingredient" aria-label="Adaugă ingredient"><datalist id="dlp2">${allProducts().map(x=>`<option value="${esc(x)}">`).join("")}</datalist></form></div>
  <p class="small muted" id="rcount"></p>
  <div class="rgrid" id="rlist"></div></div>
  <aside class="card detail" id="detail"></aside></div>`}
function addSel(e){e.preventDefault();const v=$("selq").value.trim().toLowerCase();if(v&&!S.sel.includes(v)){S.sel.push(v);save();draw()}}
function filtered(){const A=avail(),q=Q.trim().toLowerCase();
 let l=recipes().filter(r=>{
  if(S.rcat=="Favorite"&&!S.fav.includes(r.id))return false;
  if(S.rcat=="Vegetarian"&&!r.veg)return false;
  if(S.rcat=="Rapid"&&r.t>20)return false;
  if(MEALS.concat("Desert").includes(S.rcat)&&!(r.cat||[]).includes(S.rcat))return false;
  if(q&&!r.n.toLowerCase().includes(q)&&!r.i.some(x=>x[0].includes(q)))return false;
  if(S.sel.length&&!r.i.some(x=>S.sel.includes(x[0])))return false;return true});
 const D={"Ușor":1,"Mediu":2,"Avansat":3};
 l.sort(S.sort=="time"?(a,b)=>a.t-b.t:S.sort=="dif"?(a,b)=>D[a.dif]-D[b.dif]||a.t-b.t:(a,b)=>compat(b,A)/b.i.length-compat(a,A)/a.i.length||compat(b,A)-compat(a,A)||a.t-b.t);
 return l}
function renderRecipes(){if(!$("rlist"))return;const l=filtered();
 if(!l.find(r=>r.id==S.detail)&&l[0])S.detail=l[0].id;
 $("rcount").textContent=`${l.length} ${l.length==1?"rețetă":"rețete"}${S.sort=="compat"?", ordonate după ce ai în frigider":""}`;
 $("rlist").innerHTML=l.map(r=>rcard(r,r.id==S.detail)).join("")||`<div class="empty" style="grid-column:1/-1"><img src="img/bowl_with_spoon.png" alt="">Nicio rețetă nu se potrivește. Încearcă alt filtru sau alte ingrediente.</div>`;
 renderDetail()}
function renderDetail(){const d=$("detail");if(!d)return;const r=byId(S.detail);if(!r){d.innerHTML="";return}
 d.innerHTML=`<div style="position:relative">${tile(r)}${heartBtn(r.id)}</div><div class="detail-b"><h2>${esc(r.n)}</h2>
  <p class="meta">${I("clock")}${r.t} min · ${I("level")}${esc(r.dif)} · ${r.por} porții</p>${compatLine(r)}
  <div><p class="h3" style="margin-bottom:4px">Ingrediente</p>${ingList(r)}</div>
  <button class="btn primary" onclick="openRecipe('${r.id}')">Vezi rețeta completă ${I("arrow")}</button></div>`}
function ingList(r){const A=avail();return `<ul class="ilist">${r.i.map(([n,q,u])=>{const ok=A.has(n),sb=!ok&&subFor(n,A);
 return `<li><span class="st ${ok?"ok":sb?"sub":"no"}">${I(ok||sb?"check":"x")}</span>${thumb(n)}<span class="n">${esc(n)}${sb?`<small>Poți folosi ${esc(sb)} din frigider</small>`:""}</span><span class="q">${fmtQ(q,u)}</span></li>`}).join("")}</ul>`}
const wide=()=>matchMedia("(min-width:1281px)").matches;
function pick(id){if(S.page=="retete"&&wide()){S.detail=id;save();document.querySelectorAll(".rcard").forEach(c=>c.removeAttribute("aria-current"));event?.currentTarget?.setAttribute?.("aria-current","true");renderDetail()}else openRecipe(id)}

/* ---------- Modal rețetă ---------- */
function openModal(html,sm){$("modal").innerHTML=`<div class="scrim" onclick="if(event.target===this)closeModal()"><div class="sheet ${sm?"sm":""}" role="dialog" aria-modal="true"><button class="iconbtn x" onclick="closeModal()" aria-label="Închide">${I("x")}</button>${html}</div></div>`;
 $("modal").hidden=false;document.body.style.overflow="hidden";$("modal").querySelector(".x").focus()}
function closeModal(){$("modal").hidden=true;$("modal").innerHTML="";document.body.style.overflow="";COOK=null;draw()}
addEventListener("keydown",e=>{if(e.key=="Escape"){if(!$("modal").hidden)closeModal();else if(POP){POP=null;drawPop()}}});
function openRecipe(id){const r=byId(id);if(!r)return;POP=null;drawPop();
 const locked=!prem()&&!S.viewed.includes(id)&&S.viewed.length>=S.limit;
 if(!locked&&!prem()&&!S.viewed.includes(id)){S.viewed.push(id);save()}
 const A=avail(),miss=r.i.filter(x=>!A.has(x[0])),P=prem();
 const nut=`<div class="nut ${P?"":"locked"}"><div class="cells"><div><b>${P?r.k:"000"}</b><span>kcal</span></div><div><b>${P?r.p:"00"} g</b><span>proteine</span></div><div><b>${P?r.c:"00"} g</b><span>carbohidrați</span></div><div><b>${P?r.f:"00"} g</b><span>grăsimi</span></div></div>
  ${P?"":`<div class="lockmsg"><button class="btn honey sm" onclick="go('premium')">${I("lock")}Deblochează cu Premium</button></div>`}</div><p class="small muted" style="margin-top:6px">Valori nutriționale pe porție.</p>`;
 const days=[...Array(7)].map((_,k)=>addD(monday(),k));
 const body=locked?`<div class="paywall"><p class="eyebrow" style="color:var(--honey)">${I("crown")} Premium</p><h3>Ai deschis toate cele ${S.limit} rețete gratuite</h3><p>Cu Premium ai acces nelimitat la rețete, valori nutriționale și planificare automată.</p><button class="btn honey" onclick="go('premium')">Vezi planurile</button></div>`
 :`<div class="cols2"><div style="display:flex;flex-direction:column;gap:12px"><p class="h3">Ingrediente</p>${ingList(r)}
   ${miss.length?`<button class="btn sm" id="missBtn" onclick="addMissing('${id}')">${I("cart")}Adaugă ${miss.length} ${miss.length==1?"produs lipsă":"produse lipsă"} pe listă</button>`:`<p class="compat">${I("checkc")}Ai toate ingredientele</p>`}
   <div class="box"><p class="h3" style="font-size:14px">Adaugă în planificator</p><div class="form"><select id="pday" class="field" aria-label="Zi">${days.map(d=>`<option value="${iso(d)}" ${iso(d)==iso(today0())?"selected":""}>${dayName(d)} ${d.getDate()}</option>`).join("")}</select>
   <select id="pmeal" class="field" aria-label="Masă">${MEALS.map(m=>`<option ${(r.cat||[]).includes(m)?"":""}>${m}</option>`).join("")}</select><button class="btn sm" onclick="S.plan[$('pday').value+'|'+$('pmeal').value]='${id}';save();toast('Adăugată în planificator')">${I("cal")}Adaugă</button></div></div></div>
  <div style="display:flex;flex-direction:column;gap:12px"><p class="h3">Preparare</p><ol class="steps">${r.s.map(x=>`<li><span>${esc(x)}</span></li>`).join("")}</ol>
   <div id="cookbox"><button class="btn primary" onclick="cookAsk('${id}')">${I("cook")}Am gătit-o</button><p class="small muted" style="margin-top:6px">Scădem ingredientele folosite din frigider, după confirmare.</p></div></div></div>`;
 openModal(`<div class="sheet-top"><div class="media">${tile(r)}${heartBtn(id)}</div>
  <div style="display:flex;flex-direction:column;gap:10px;padding-right:36px"><p class="eyebrow">${(r.cat||[]).join(" · ")}${r.veg?" · Vegetarian":""}</p><h2>${esc(r.n)}</h2><p class="muted">${esc(r.d||"")}</p>
  <div class="facts"><span class="fact">${I("clock")}${r.t} min</span><span class="fact">${I("level")}${esc(r.dif)}</span><span class="fact">${I("users")}${r.por} porții</span><span class="fact" style="color:var(--green)">${I("checkc")}${compat(r,A)} din ${r.i.length} disponibile</span></div></div></div>
  <div class="sheet-b">${nut}${body}</div>`)}
function dayName(d){return["Duminică","Luni","Marți","Miercuri","Joi","Vineri","Sâmbătă"][d.getDay()]}
function addMissing(id){const A=avail();let k=0;byId(id).i.forEach(([n,q,u])=>{if(!A.has(n)&&!S.shop.some(s=>s.n==n&&!s.d)){S.shop.push({n,q,u,d:false});k++}});save();
 const b=$("missBtn");if(b){b.innerHTML=I("check")+(k?`Am adăugat ${k} pe listă`:"Sunt deja pe listă");b.disabled=true}}
function cookPlan(r){return r.i.map(([n,q,u])=>{const f=S.fridge.find(x=>x.n==n);if(!f)return null;
 let rq=+q;if(f.u=="kg"&&u=="g")rq=q/1000;else if(f.u=="l"&&u=="ml")rq=q/1000;else if(f.u!=u)return{n,manual:true};return{n,rq,u:f.u}}).filter(Boolean)}
function cookAsk(id){const pl=cookPlan(byId(id));COOK=id;
 $("cookbox").innerHTML=`<div class="box honey"><p class="h3" style="font-size:14px">Scădem din frigider:</p><ul style="margin:0;padding-left:18px;font-size:14px">${pl.map(x=>x.manual?`<li>${esc(x.n)}: verifici tu cantitatea</li>`:`<li>${esc(x.n)}: −${num(x.rq)} ${esc(x.u)}</li>`).join("")||"<li>Niciun ingredient din frigider</li>"}</ul>
  <div style="display:flex;gap:8px"><button class="btn primary sm" onclick="cookDo('${id}')">Confirmă</button><button class="btn sm" onclick="openRecipe('${id}')">Anulează</button></div></div>`}
function cookDo(id){const pl=cookPlan(byId(id));let k=0;pl.forEach(x=>{if(x.manual)return;const f=S.fridge.find(y=>y.n==x.n);f.q=Math.round((+f.q-x.rq)*100)/100;k++;if(f.q<=0)S.fridge.splice(S.fridge.indexOf(f),1)});
 S.demo=false;save();$("cookbox").innerHTML=`<p class="compat">${I("checkc")}Poftă bună! Am actualizat ${k} produse în frigider.</p>`}

/* ---------- Frigider ---------- */
function vFridge(){
 const total=S.fridge.length,ex=expiring(),val=S.fridge.reduce((s,f)=>s+value(f),0),q=Q.trim().toLowerCase();
 const list=S.fridge.map((f,i)=>({...f,i,cat:prod(f.n).cat})).filter(f=>(S.fcat=="Toate"||f.cat==S.fcat)&&(!(window.FQ||"")||f.n.includes(window.FQ.toLowerCase())));
 const sel=S.fridge.filter(f=>f.s).length;
 const exN=new Set(ex.map(f=>f.n)),useIt=recipes().filter(r=>r.i.some(x=>exN.has(x[0]))).slice(0,3);
 return `<div class="pagehead"><div><h1>Frigiderul meu</h1><p>Gestionează-ți ingredientele și evită risipa alimentară.</p></div>

  <label class="lbl">Unitate<select id="fu" class="field">${["buc","g","kg","ml","l","cap","legătură"].map(u=>`<option>${u}</option>`).join("")}</select></label>
  <label class="lbl">Expiră la<input id="fx" class="field" type="date" value="${inDays(7)}"></label>
  <button class="btn primary">Adaugă</button><button type="button" class="btn ghost" onclick="S.addOpen=false;save();draw()">Închide</button></div></form>`:""}
 ${S.demo?`<div class="freebar" style="background:var(--green-soft);color:var(--green-dk)">Produsele afișate sunt exemple, ca să vezi cum funcționează frigiderul.<button class="link" style="color:var(--green-dk)" onclick="S.fridge=[];S.demo=false;save();draw()">Golește frigiderul</button></div>`:""}
 <div class="stats"><div class="card stat"><span class="ic g">${I("leaf")}</span><span><small>Total ingrediente</small><b>${total}</b></span></div>
  <div class="card stat"><span class="ic r">${I("alarm")}</span><span><small>Expiră în 3 zile</small><b>${ex.length}</b></span></div>
  <div class="card stat"><span class="ic h">${I("coin")}</span><span><small>Valoare estimată</small><b>${Math.round(val).toLocaleString("ro-RO")} MDL</b></span></div></div>
 ${useIt.length?`<div class="suggest">${I("alarm")}<span><b>${ex.length} ${ex.length==1?"produs expiră":"produse expiră"} curând.</b> Le poți folosi în:</span><div class="chips">${useIt.map(r=>`<button class="chip" onclick="openRecipe('${r.id}')">${esc(r.n)}</button>`).join("")}</div></div>`:""}
 <div class="toolbar"><label class="search" style="max-width:260px">${I("search")}<input id="fsearch" type="search" placeholder="Caută ingredient…" value="${esc(window.FQ||"")}" oninput="window.FQ=this.value;draw();const e=$('fsearch');e.focus();e.setSelectionRange(e.value.length,e.value.length)" aria-label="Caută în frigider"></label>
  <div class="chips">${["Toate",...CATS].map(c=>`<button class="chip" aria-pressed="${S.fcat==c}" onclick="S.fcat='${c}';save();draw()">${c}</button>`).join("")}</div></div>
 ${list.length?`<div class="fcols">${CATS.map(c=>{const it=list.filter(f=>f.cat==c).sort((a,b)=>(a.x||"9").localeCompare(b.x||"9"));if(!it.length)return"";
  return `<div class="card fcol"><div class="fcol-h">${CATT[c]}<span class="badge">${it.length}</span></div>${it.map(f=>{const st=["g","ml"].includes(f.u)?50:1;return `<div class="frow">

   <span class="n"><b>${esc(f.n)}</b><span>${fmtQ(f.q,f.u)}${f.x?" · ":""}${expLabel(f.x)}</span></span>

 :`<div class="empty"><img src="img/leafy_green.png" alt="">${S.fridge.length?"Niciun produs nu se potrivește filtrului.":"Frigiderul e gol. Apasă „Adaugă ingredient” ca să începi."}</div>`}
 ${sel?`<div class="actionbar"><span>${sel} ${sel==1?"produs selectat":"produse selectate"}</span><button class="btn honey" onclick="cookFrom()">Vezi ce poți găti ${I("arrow")}</button></div>`:`<p class="small muted">Bifează produsele pe care vrei să le folosești și îți arătăm rețetele potrivite.</p>`}`}
function qty(i,d){const f=S.fridge[i];f.q=Math.max(0,Math.round((+f.q+d)*100)/100);S.demo=false;save();draw()}
function addFridge(e){e.preventDefault();const n=$("fn").value.trim().toLowerCase();if(!n)return;
 const ex=S.fridge.find(f=>f.n==n&&f.u==$("fu").value);
 if(ex){ex.q=+ex.q+(+$("fq").value||0);if($("fx").value)ex.x=$("fx").value}else S.fridge.push({n,q:+$("fq").value||1,u:$("fu").value,x:$("fx").value,s:false});

 ${inF?`<div class="suggest">${I("fridge")}<span><b>${inF} ${inF==1?"produs e":"produse sunt"} deja în frigider.</b></span><button class="btn sm" onclick="S.shop=S.shop.filter(s=>s.d||!inFridge(s.n));save();draw();toast('Am eliminat produsele pe care le ai')">Elimină-le din listă</button></div>`:""}
 ${S.shop.length?`<div class="scols">${CATS.map(c=>{const it=todo.filter(s=>prod(s.n).cat==c);return it.length?`<div class="card slist"><div class="fcol-h" style="padding-top:12px">${CATT[c]}<span class="badge">${it.length}</span></div>${it.map(row).join("")}</div>`:""}).join("")}
  ${done.length?`<div class="card slist"><div class="fcol-h" style="padding-top:12px">În coș<span class="badge">${done.length}</span></div>${done.map(row).join("")}
   <div style="display:flex;gap:8px;flex-wrap:wrap;padding:12px 0"><button class="btn primary sm" onclick="toFridge()">${I("fridge")}Mută în frigider</button><button class="btn sm" onclick="S.shop=S.shop.filter(s=>!s.d);save();draw()">Șterge din listă</button></div></div>`:""}</div>`
 :`<div class="empty"><img src="img/red_apple.png" alt="">Lista e goală. Adaugă produse sau importă ingredientele lipsă dintr-o rețetă.</div>`}
 ${prem()?"":`<div class="card" style="padding:16px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">${I("users")}<span style="flex:1;min-width:200px"><b>Liste partajate cu familia</b><br><span class="small muted">Cu Premium, lista se actualizează pentru toți membrii familiei.</span></span><button class="btn sm" onclick="go('premium')">${I("crown")}Află mai mult</button></div>`}`}
function addShop(e){e.preventDefault();const n=$("sn").value.trim().toLowerCase();if(!n)return;S.shop.push({n,q:$("sq").value?+$("sq").value:"",u:$("sq").value?$("su").value:"",d:false});save();draw();setTimeout(()=>$("sn")&&$("sn").focus())}
function toFridge(){const d=S.shop.filter(s=>s.d);d.forEach(s=>{const f=S.fridge.find(x=>x.n==s.n&&x.u==s.u);if(f&&s.q)f.q=+f.q+(+s.q);else if(!f)S.fridge.push({n:s.n,q:s.q||1,u:s.u||"buc",x:inDays(7),s:false})});
 S.shop=S.shop.filter(s=>!s.d);S.demo=false;save();draw();toast(`${d.length} produse mutate în frigider`)}
function shareList(){const t="Lista de cumpărături Gusto:\n"+S.shop.filter(s=>!s.d).map(s=>`- ${s.n}${s.q?` (${num(s.q)} ${s.u})`:""}`).join("\n");
 const done=()=>toast("Lista a fost copiată. O poți lipi într-un mesaj.");
 try{navigator.clipboard.writeText(t).then(done,()=>showText(t))}catch(e){showText(t)}}
function showText(t){openModal(`<div class="sheet-b"><h2 style="font-size:20px">Copiază lista</h2><textarea id="sharet" class="field" rows="8" readonly>${esc(t)}</textarea><p class="small muted">Textul e selectat. Copiază-l și trimite-l cui vrei.</p></div>`,1);setTimeout(()=>{$("sharet").select()})}
function importPick(){openModal(`<div class="sheet-b"><h2 style="font-size:20px">Importă din rețetă</h2><p class="muted small">Adăugăm doar ingredientele pe care nu le ai.</p>
 <ul class="plist">${recipes().map(r=>{const m=r.i.filter(x=>!avail().has(x[0])).length;return `<li><button onclick="addMissing('${r.id}');closeModal();toast('Ingredientele lipsă au fost adăugate')"><span class="thumb">${tile(r)}</span><span style="flex:1"><b>${esc(r.n)}</b><br><span class="small muted">${m?`${m} ${m==1?"ingredient lipsă":"ingrediente lipsă"}`:"ai tot"}</span></span></button></li>`}).join("")}</ul></div>`,1)}

/* ---------- Planificator ---------- */
function vPlan(){const m=monday(),days=[...Array(7)].map((_,k)=>addD(m,k)),td=iso(today0());
 const planned=days.flatMap(d=>MEALS.map(x=>S.plan[iso(d)+"|"+x])).filter(Boolean);
 const f=d=>`${d.getDate()}.${String(d.getMonth()+1).padStart(2,"0")}`;
 return `<div class="pagehead"><div><h1>Planificator de mese</h1><p>Săptămâna ${f(days[0])} – ${f(days[6])} · ${planned.length} din 21 de mese planificate</p></div>
  <div class="acts"><button class="btn" onclick="planShop()">${I("cart")}Lipsurile pe listă</button>
  <button class="btn ${prem()?"primary":""}" onclick="autoPlan()">${prem()?I("spark"):I("lock")}Planificare automată</button></div></div>
 ${prem()?"":`<div class="freebar">${I("crown")}Planificarea automată pentru toată săptămâna, după ce ai în frigider, e inclusă în Premium. Manual poți planifica oricând.<button class="link" onclick="go('premium')">Vezi Premium ${I("arrow")}</button></div>`}
 <div class="week">${days.map(d=>{const k=iso(d);return `<div class="card day ${k==td?"today":""}"><div class="day-h"><b>${dayName(d)}</b><span>${f(d)}</span></div>
  ${MEALS.map(x=>{const r=byId(S.plan[k+"|"+x]);const s=r&&rsrc(r);return `<button class="slot" onclick="slotPick('${k}','${x}')"><small>${x}</small>${r?`<span class="pick">${s?`<img src="${s.u}" class="${s.photo?"":"ill"}" alt="">`:""}<span>${esc(r.n)}</span></span>`:`<span class="slot-add">${I("plus")}Adaugă</span>`}</button>`}).join("")}</div>`}).join("")}</div>
 ${planned.length?`<p class="small muted">Atinge o masă ca s-o schimbi sau s-o elimini.</p>`:""}`}
function slotPick(k,meal){const A=avail(),cur=S.plan[k+"|"+meal];
 const l=recipes().slice().sort((a,b)=>((b.cat||[]).includes(meal)-(a.cat||[]).includes(meal))||compat(b,A)/b.i.length-compat(a,A)/a.i.length);
 openModal(`<div class="sheet-b"><div><p class="eyebrow">${dayName(new Date(k+"T00:00"))} · ${meal}</p><h2 style="font-size:22px">Alege o rețetă</h2></div>
 <ul class="plist">${l.map(r=>`<li><button onclick="S.plan['${k}|${meal}']='${r.id}';save();closeModal()"><span class="thumb">${tile(r)}</span><span style="flex:1"><b>${esc(r.n)}</b><br><span class="small muted">${r.t} min · ${compat(r,A)} din ${r.i.length} disponibile</span></span>${r.id==cur?I("checkc"):""}</button></li>`).join("")}</ul>
 ${cur?`<button class="btn" onclick="delete S.plan['${k}|${meal}'];save();closeModal()">${I("trash")}Elimină din plan</button>`:""}</div>`,1)}
function autoPlan(){if(!prem()){go("premium");toast("Planificarea automată e inclusă în Premium");return}
 const A=avail(),used=new Set(Object.values(S.plan));let n=0;
 [...Array(7)].map((_,k)=>iso(addD(monday(),k))).forEach(k=>MEALS.forEach(m=>{if(S.plan[k+"|"+m])return;
  const c=recipes().filter(r=>(r.cat||[]).includes(m)).sort((a,b)=>(used.has(a.id)-used.has(b.id))||compat(b,A)/b.i.length-compat(a,A)/a.i.length);
  if(c[0]){S.plan[k+"|"+m]=c[0].id;used.add(c[0].id);n++}}));
 save();draw();toast(n?`Am completat ${n} mese, după ce ai în frigider`:"Săptămâna e deja planificată")}
function planShop(){const A=avail(),need={};Object.entries(S.plan).forEach(([k,id])=>{const d=new Date(k.split("|")[0]+"T00:00");if(d<monday()||d>addD(monday(),6))return;const r=byId(id);r&&r.i.forEach(([n,q,u])=>{if(!A.has(n)){need[n]=need[n]||{q:0,u};if(need[n].u==u&&typeof q=="number")need[n].q+=q}})});
 let k=0;Object.entries(need).forEach(([n,v])=>{if(!S.shop.some(s=>s.n==n&&!s.d)){S.shop.push({n,q:v.q||"",u:v.q?v.u:"",d:false});k++}});save();draw();toast(k?`Am adăugat ${k} produse pe listă`:"Ai deja tot ce trebuie")}

/* ---------- Premium ---------- */
function vPremium(){const P=prem();
 const B=[["grid","Rețete nelimitate","Acces la toate rețetele, cu filtre avansate."],["cal","Planificator de mese","Planificare automată pentru toată săptămâna."],["fridge","Frigider avansat","Notificări de expirare și sugestii de rețete."],["users","Liste partajate","Cumpărături comune cu familia."],["spark","Recomandări personalizate","Rețete adaptate preferințelor tale."]];
 const T=[["Descoperire de rețete","De bază","Filtre și personalizare extinsă"],["Gestionare frigider","Inventar de bază","Inventar avansat și notificări"],["Liste de cumpărături","Liste interactive","Liste partajate și optimizate"],["Planificator de mese","Manual","Planificare automată"],["Valori nutriționale","Ascunse","Calorii și macronutrienți"],["Preferințe alimentare","Setări de bază","Recomandări personalizate"],["Statistici anti-risipă","Sumar simplu","Rapoarte și tendințe"],["Rețete pe lună",`${S.limit}`,"Nelimitat"]];
 return `<section class="phero"><div class="phero-t"><p class="eyebrow">${I("crown")}Abonament Premium</p><h1><span>Mai mult decât rețete.</span><span>Un stil de viață mai sănătos.</span></h1>
  <p>Accesează toate funcționalitățile avansate și bucură-te de o experiență completă în bucătărie.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn honey" onclick="document.getElementById('plans').scrollIntoView({behavior:'smooth'})">Alege planul potrivit</button><button class="btn ghost" onclick="document.getElementById('cmp').scrollIntoView({behavior:'smooth'})">Află mai multe ${I("arrow")}</button></div></div>
  <div class="phero-img"><img src="photo/premium.jpg" alt=""></div></section>
 <section style="display:flex;flex-direction:column;gap:16px"><div class="sechead"><h2>Beneficiile tale Premium</h2></div>
  <div class="benefits">${B.map(([ic,t,d])=>`<div class="benefit"><span class="ic ${ic=="spark"?"h":"g"}">${I(ic)}</span><span><b>${t}</b><span>${d}</span></span></div>`).join("")}</div></section>
 <section id="plans" style="display:flex;flex-direction:column;gap:16px"><div class="sechead"><h2>Alege planul</h2></div>
  <div class="plans"><div class="card plan"><h3>Gratuit</h3><p class="small muted">Esențial pentru început</p>
   <ul>${["Rețete de bază (" + S.limit + " pe lună)","Inventar simplu al frigiderului","Liste interactive","Planificare manuală"].map(x=>`<li>${I("check")}${x}</li>`).join("")}</ul>
   <div class="price"><span><b>0 MDL</b> <small>/ lună</small></span>${P?`<button class="btn sm" onclick="setRole('free')">Treci la Gratuit</button>`:`<button class="btn sm" disabled>Planul tău</button>`}</div></div>
  <div class="card plan feat"><span class="ribbon">Popular</span><h3>Premium</h3><p class="small muted">Tot ce ai nevoie pentru o experiență completă</p>
   <ul>${["Toate funcționalitățile gratuite","Rețete nelimitate și valori nutriționale","Planificator de mese automat","Recomandări personalizate","Liste partajate și optimizate"].map(x=>`<li>${I("check")}${x}</li>`).join("")}</ul>
   <div class="price"><span><b>${num(S.price)} MDL</b> <small>/ lună</small></span>${P?`<button class="btn sm" disabled>${I("check")}Activ</button>`:`<button class="btn primary sm" onclick="setRole('premium')">Alege Premium</button>`}</div></div>
  <div class="card promo">${I("leaf")}<h3>Investește în sănătatea ta și în timpul tău.</h3><p>Cu Premium gătești mai ușor, mai inteligent și mai gustos.</p><img src="photo/hero.jpg" alt=""></div></div>
  <p class="small muted">Demonstrație: butonul activează Premium fără plată. În versiunea reală plata se face prin Stripe, confirmată prin webhook.</p></section>
 <section id="cmp" style="display:flex;flex-direction:column;gap:16px"><div class="sechead"><h2>Gratuit sau Premium</h2></div>
  <div class="card tablewrap"><table class="cmp"><thead><tr><th>Funcționalitate</th><th>Gratuit</th><th>Premium</th></tr></thead><tbody>${T.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div></section>`}

/* ---------- Administrare ---------- */
function vAdmin(){const ROLES=["Membru","Moderator","Administrator"];const G=[...new Set([...R.filter(r=>r.img).map(r=>r.img),...EXTRA])];
 return `<div class="pagehead"><div><h1>Administrare</h1><p>${isAdmin()?"Acces complet":"Acces de moderator: rețete și imagini"}</p></div></div><div class="panels">
 ${isAdmin()?`<div class="card panel"><h3>Abonament Premium</h3>
  <label class="lbl">Rețete gratuite pe lună (plan Gratuit)<input id="alim" class="field" type="number" min="0" value="${S.limit}" onchange="S.limit=Math.max(0,+this.value);save();toast('Limită salvată')"></label>
  <label class="lbl">Preț Premium (MDL pe lună)<input id="aprc" class="field" type="number" min="0" step="1" value="${S.price}" onchange="S.price=+this.value;save();toast('Preț salvat')"></label>
  <p class="small muted">Plata reală: Stripe, confirmată prin webhook, în versiunea Next.js.</p></div>`:""}
 ${canFront()?`<div class="card panel"><h3>Pagina principală</h3>
  <label class="lbl">Titlu, rândul 1<input id="h1a" class="field" value="${esc(S.hero.t1)}"></label><label class="lbl">Titlu, rândul 2<input id="h1b" class="field" value="${esc(S.hero.t2)}"></label>
  <label class="lbl">Text<textarea id="hd" class="field" rows="3">${esc(S.hero.d)}</textarea></label>
  <div><button class="btn primary" onclick="S.hero={t1:$('h1a').value,t2:$('h1b').value,d:$('hd').value};save();toast('Pagina principală a fost actualizată')">Salvează</button></div></div>`
 :`<div class="card panel"><h3>Pagina principală</h3><p class="muted">Un administrator îți poate da dreptul să editezi pagina principală.</p></div>`}
 <div class="card panel"><h3>Rețetă nouă</h3>
  <label class="lbl">Nume<input id="rn" class="field" placeholder="ex. Zacuscă de vinete"></label>
  <label class="lbl">Descriere scurtă<input id="rd" class="field"></label>
  <label class="lbl">Ingrediente, câte unul pe rând (nume cantitate unitate)<textarea id="ri" class="field" rows="4" placeholder="roșii 500 g&#10;ouă 4 buc&#10;usturoi 2 căței"></textarea></label>
  <div class="form"><label class="lbl">Minute<input id="rt" class="field w90" type="number" min="1" value="30"></label><label class="lbl">Porții<input id="rp2" class="field w90" type="number" min="1" value="4"></label>
   <label class="lbl">Dificultate<select id="rdf" class="field"><option>Ușor</option><option>Mediu</option><option>Avansat</option></select></label></div>
  <div class="cats">${["Mic dejun","Prânz","Cină","Desert"].map(c=>`<label><input type="checkbox" class="rcat" value="${c}">${c}</label>`).join("")}<label><input type="checkbox" id="rveg">Vegetarian</label></div>
  <div class="form"><label class="lbl">kcal<input id="rk" class="field w90" type="number" min="0"></label><label class="lbl">Proteine (g)<input id="rp" class="field w90" type="number" min="0"></label><label class="lbl">Carbohidrați (g)<input id="rc" class="field w90" type="number" min="0"></label><label class="lbl">Grăsimi (g)<input id="rf" class="field w90" type="number" min="0"></label></div>
  <label class="lbl">Pași, câte unul pe rând<textarea id="rs" class="field" rows="4"></textarea></label>
  <div class="lbl">Imagine<div class="gallery" id="gal">${G.map(g=>`<button type="button" aria-pressed="${!NEWIMG.photo&&NEWIMG.img==g}" onclick="NEWIMG={img:'${g}',photo:null};document.querySelectorAll('#gal button').forEach(b=>b.setAttribute('aria-pressed',b===this))" aria-label="${g.replace(/_/g," ")}"><img src="img/${g}.png" alt="" loading="lazy"></button>`).join("")}</div>
   <label class="btn sm" style="align-self:flex-start">${I("plus")}Încarcă o fotografie<input type="file" accept="image/*" hidden onchange="readImg(this.files[0],u=>{NEWIMG={img:null,photo:u};document.querySelectorAll('#gal button').forEach(b=>b.setAttribute('aria-pressed',false));toast('Fotografie încărcată')})"></label></div>
  <div><button class="btn primary" onclick="addRec()">Publică rețeta</button></div></div>
 <div class="card panel"><h3>Rețete și fotografii</h3><p class="small muted">${recipes().length} rețete. La lansare: cel puțin 100.</p>
  <ul class="alist">${recipes().map(r=>`<li><span class="thumb">${tile(r)}</span><span class="grow">${esc(r.n)}</span>
   <label class="btn sm">Schimbă poza<input type="file" accept="image/*" hidden onchange="readImg(this.files[0],u=>{S.photos['${r.id}']=u;save();draw();toast('Fotografie înlocuită')})"></label>
   ${S.photos[r.id]?`<button class="iconbtn" aria-label="Revino la imaginea inițială" onclick="delete S.photos['${r.id}'];save();draw()">${I("reset")}</button>`:""}
   ${r.id.startsWith("c-")?`<button class="iconbtn" aria-label="Șterge rețeta" onclick="S.custom=S.custom.filter(x=>x.id!='${r.id}');save();draw()">${I("trash")}</button>`:""}</li>`).join("")}</ul></div>
 ${isAdmin()?`<div class="card panel"><h3>Utilizatori și roluri</h3>
  <ul class="alist">${S.users.map((u,i)=>`<li><span class="avatar" style="width:30px;height:30px;font-size:11px">${esc(u.n.slice(0,2).toUpperCase())}</span><span class="grow">${esc(u.n)}</span>
   <select class="field" aria-label="Rol pentru ${esc(u.n)}" onchange="S.users[${i}].r=this.value;save();toast('Rol actualizat')">${ROLES.map(r=>`<option ${r==u.r?"selected":""}>${r}</option>`).join("")}</select>
   <button class="btn sm" onclick="blk(${jsq(u.n)})">Blochează</button></li>`).join("")}</ul>
  <label class="switch"><input type="checkbox" ${S.modFront?"checked":""} onchange="S.modFront=this.checked;save()">Moderatorii pot edita pagina principală</label></div>
 <div class="card panel"><h3>Blocări</h3>
  <form class="form" onsubmit="event.preventDefault();blk($('bk').value)"><input id="bk" class="field grow" placeholder="Adresă IP sau email" aria-label="IP sau email de blocat"><button class="btn">Blochează</button></form>
  ${S.blocked.length?`<ul class="alist">${S.blocked.map((b,i)=>`<li><span class="exp d">Blocat</span><span class="grow">${esc(b)}</span><button class="btn sm" onclick="S.blocked.splice(${i},1);save();draw()">Deblochează</button></li>`).join("")}</ul>`:`<p class="muted">Nicio blocare activă.</p>`}
  <p class="small muted">Blocarea și verificarea rolurilor se aplică pe server în versiunea Next.js.</p></div>`:""}
 </div>`}
function blk(v){v=(v||"").trim();if(v&&!S.blocked.includes(v)){S.blocked.push(v);save();draw();toast("Blocat: "+v)}}
function readImg(file,cb){if(!file)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.82))};im.src=fr.result};fr.readAsDataURL(file)}
function addRec(){const n=$("rn").value.trim();
 const i=$("ri").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.*?)\s+(\d+(?:[.,]\d+)?)\s*(.*)$/);return m?[m[1].toLowerCase(),+m[2].replace(",","."),m[3]]:[l.toLowerCase(),"",""]});
 if(!n||!i.length){toast("Completează numele și cel puțin un ingredient");return}
 const r={id:"c-"+Date.now(),n,d:$("rd").value.trim(),i,img:NEWIMG.img,photo:NEWIMG.photo,t:+$("rt").value||30,por:+$("rp2").value||4,dif:$("rdf").value,
  cat:[...document.querySelectorAll(".rcat:checked")].map(x=>x.value),veg:$("rveg").checked?1:0,
  k:+$("rk").value||0,p:+$("rp").value||0,c:+$("rc").value||0,f:+$("rf").value||0,s:$("rs").value.split("\n").map(x=>x.trim()).filter(Boolean)};
 if(!r.s.length)r.s=["Pașii vor fi adăugați în curând."];
 S.custom.push(r);NEWIMG={img:"cooking",photo:null};save();draw();toast("Rețeta a fost publicată")}

draw();
</script>
</body>
